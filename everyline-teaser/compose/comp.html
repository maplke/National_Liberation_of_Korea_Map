<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>Everyline: Rail — Launch Teaser composition</title>
<style>
@font-face{font-family:W;font-weight:400;src:url(assets/ELWanted-400.woff2) format('woff2')}
@font-face{font-family:W;font-weight:600;src:url(assets/ELWanted-600.woff2) format('woff2')}
@font-face{font-family:P;font-weight:400;src:url(assets/ELPaper-400.woff2) format('woff2')}
@font-face{font-family:P;font-weight:600;src:url(assets/ELPaper-600.woff2) format('woff2')}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.shot img.f{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.shot img.glow{position:absolute;inset:0;width:100%;height:100%;filter:blur(14px) brightness(1.6);mix-blend-mode:screen;opacity:0}
.shot .grade{position:absolute;inset:0;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse 46% 26% at 50% 50%,rgba(10,14,22,.62),rgba(10,14,22,.25) 55%,transparent 100%);opacity:0}
#txt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:W,P,sans-serif;font-weight:600;
  font-size:76px;letter-spacing:-.01em;color:#fff;white-space:nowrap;text-shadow:0 2px 30px rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.35)}
#txt span{display:inline-block;margin:0 .14em}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0}
#top{position:absolute;top:34px;left:0;right:0;text-align:center;font-family:W,P;font-weight:400;font-size:21px;letter-spacing:.18em;color:rgba(255,255,255,.62);opacity:0}
#wm{position:absolute;right:40px;bottom:34px;width:74px;opacity:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
#year{position:absolute;left:96px;bottom:84px;font-family:W;font-weight:600;font-size:132px;color:#fff;letter-spacing:-.02em;opacity:0;text-shadow:0 4px 40px rgba(0,0,0,.4)}
#year small{display:block;font-size:30px;font-weight:400;letter-spacing:.04em;opacity:.8;margin-bottom:-6px}
#white{position:absolute;inset:0;background:#fff;opacity:0}
#end{position:absolute;inset:0;opacity:0}
#end .banner{position:absolute;left:50%;top:44%;width:1180px;transform:translate(-50%,-50%)}
#end .soon{position:absolute;left:0;right:0;top:63%;text-align:center;font-family:W,P;color:#2B2F36}
#end .soon b{display:block;font-weight:600;font-size:44px;letter-spacing:.32em;margin-left:.32em}
#end .soon i{display:block;font-style:normal;font-weight:600;font-size:34px;letter-spacing:.4em;margin:16px 0 0 .4em;color:#5A606B}
#end .pub{position:absolute;left:50%;bottom:64px;width:230px;transform:translateX(-50%);opacity:.9}
#black{position:absolute;inset:0;background:#000;opacity:1}
</style></head>
<body><div id="stage">
 <div id="shots"></div>
 <div class="scrim" id="scrim"></div>
 <div id="txt"></div>
 <img class="logo" id="mg" src="assets/maplegrid_h.png" style="width:640px">
 <img class="logo" id="eri" src="assets/er_icon.png" style="width:330px">
 <div id="year"></div>
 <img id="wm" src="assets/er_icon.png">
 <div id="white"></div>
 <div id="end">
  <img class="banner" src="assets/er_banner.png">
  <div class="soon"><b>COMING SOON</b><i>곧 출시</i></div>
  <img class="pub" src="assets/maplegrid_dark.png">
 </div>
 <div id="top">모든 장면은 실제 게임 화면입니다</div>
 <div id="black"></div>
</div>
<script>
const FPS=30, BEAT=0.6;
const CLIPS='clips/';
const N={night_wide:270,night_seoul:165,golden:225,skins:162,build:240,layer:96,growth1:48,growth2:48,growth3:48,growth4:48,trains:102,research:96,final:180};
// shot list: clip, start/end on the trailer clock, first clip frame, fade in/out, look, zoom (Ken Burns scale from->to)
const SHOTS=[
 {c:'night_wide', t0:0,    t1:8.4,  f0:0,  fi:0,   fo:.4, look:'night', z:[1.0,1.03]},
 {c:'night_seoul',t0:8.0,  t1:13.2, f0:0,  fi:.4,  fo:0,  look:'night', z:[1.02,1.06]},
 {c:'golden',     t0:13.2, t1:20.4, f0:0,  fi:0,   fo:0,  look:'golden',z:[1.0,1.05]},
 {c:'skins',      t0:20.4, t1:25.2, f0:0,  fi:0,   fo:0,  look:'clean', z:[1.0,1.03]},
 {c:'build',      t0:25.2, t1:29.4, f0:0,  fi:0,   fo:0,  look:'ui',    z:[1.0,1.035]},
 {c:'layer',      t0:29.4, t1:31.8, f0:6,  fi:0,   fo:0,  look:'ui',    z:[1.03,1.0]},
 {c:'growth1',    t0:31.8, t1:33.1, f0:4,  fi:0,   fo:.25,look:'clean', z:[1.0,1.0]},
 {c:'growth2',    t0:32.85,t1:34.3, f0:4,  fi:.25, fo:.25,look:'clean', z:[1.0,1.0]},
 {c:'growth3',    t0:34.05,t1:35.5, f0:4,  fi:.25, fo:.25,look:'clean', z:[1.0,1.0]},
 {c:'growth4',    t0:35.25,t1:36.6, f0:4,  fi:.25, fo:0,  look:'clean', z:[1.0,1.0]},
 {c:'trains',     t0:36.6, t1:39.0, f0:10, fi:0,   fo:0,  look:'ui',    z:[1.0,1.04]},
 {c:'research',   t0:39.0, t1:41.4, f0:10, fi:0,   fo:0,  look:'ui',    z:[1.04,1.0]},
 {c:'final',      t0:41.4, t1:47.6, f0:0,  fi:0,   fo:0,  look:'dawn',  z:[1.0,1.0]},
];
// kinetic text: each word fades/de-blurs in at its own time; whole line leaves at t1
const TEXT=[
 {t1:14.2, w:[['꿈꿀 수',9.6],['있다면',10.8]]},
 {t1:16.2, w:[['이을 수',14.4],['있다',15.0]]},
 {t1:17.4, w:[['빠르게 잇다',16.2]], cut:1},
 {t1:18.6, w:[['멀리 잇다',17.4]], cut:1},
 {t1:20.4, w:[['촘촘하게 잇다',18.6]], cut:1},
 {t1:21.6, w:[['당신답게 잇다',20.4]], cut:1},
 {t1:22.8, w:[['Connect your way',21.6]], cut:1},
 {t1:24.0, w:[['당신답게 잇다',22.8]], cut:1},
 {t1:25.2, w:[['Connect your way',24.0]], cut:1},
 {t1:29.0, w:[['쉽게 잇다',25.6]]},
 {t1:46.2, w:[['모든 선은',42.0],['당신에게서 시작된다',43.2]]},
];
const YEARS=[[31.8,1960,'창업과 첫 간선'],[33.0,1975,'전철화와 도로 방어'],[34.2,1990,'고속철 건설'],[35.4,2005,'고속망 완성']];

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sm=x=>{x=cl(x);return x*x*(3-2*x);};
const lin=(t,a,b)=>cl((t-a)/(b-a));
const $=id=>document.getElementById(id);

// build shot DOM
const shotEls=SHOTS.map(s=>{const d=document.createElement('div');d.className='shot';
 d.innerHTML='<img class="f"><img class="glow"><div class="grade"></div><div class="vig"></div>';$('shots').appendChild(d);return d;});

function looks(el,look,t,s){
 const f=el.querySelector('img.f'),g=el.querySelector('img.glow'),gr=el.querySelector('.grade'),v=el.querySelector('.vig');
 f.style.filter='';g.style.opacity=0;gr.style.background='';gr.style.mixBlendMode='';gr.style.opacity=1;v.style.opacity=0;
 if(look==='night'){f.style.filter='contrast(1.08) saturate(1.15)';g.style.opacity=.55;v.style.opacity=1;
   gr.style.background='radial-gradient(ellipse 90% 60% at 50% 0%,rgba(40,90,140,.35),transparent 70%)';gr.style.mixBlendMode='screen';}
 if(look==='golden'){f.style.filter='sepia(.55) saturate(1.7) contrast(1.18) brightness(.78)';v.style.opacity=1;g.style.opacity=.3;
   gr.style.background='radial-gradient(circle at 64% 16%,rgba(255,236,170,.95),rgba(255,170,80,.0) 38%),linear-gradient(180deg,rgba(255,176,92,1) 0%,rgba(226,110,48,1) 46%,rgba(70,28,22,1) 100%)';
   gr.style.mixBlendMode='multiply';gr.style.opacity=.85;}
 if(look==='clean'){f.style.filter='contrast(1.04) saturate(1.08)';v.style.opacity=.55;}
 if(look==='ui'){f.style.filter='contrast(1.03) saturate(1.05)';v.style.opacity=.35;}
 if(look==='dawn'){const k=lin(t,s.t0,s.t1);
   f.style.filter='contrast(1.06) saturate(1.12)';g.style.opacity=.5*(1-k);v.style.opacity=1-k*.7;
   gr.style.background='linear-gradient(180deg,rgba(255,160,90,.9),rgba(255,210,170,.2) 60%,transparent)';gr.style.mixBlendMode='soft-light';
   gr.style.opacity=Math.sin(Math.PI*cl(k*1.15));}
}

async function render(t){
 const waits=[];
 SHOTS.forEach((s,i)=>{const el=shotEls[i];
  if(t<s.t0||t>=s.t1){el.style.opacity=0;return;}
  let o=1; if(s.fi) o=Math.min(o,sm(lin(t,s.t0,s.t0+s.fi))); if(s.fo) o=Math.min(o,sm(1-lin(t,s.t1-s.fo,s.t1)));
  el.style.opacity=o;
  const fr=Math.min(N[s.c]-1,s.f0+Math.floor((t-s.t0)*FPS+1e-6));
  const src=CLIPS+s.c+'/'+String(fr).padStart(4,'0')+'.jpg';
  const f=el.querySelector('img.f'),g=el.querySelector('img.glow');
  if(!f.src.endsWith(src)){f.src=src;waits.push(f.decode().catch(()=>{}));}
  if(s.look==='night'||s.look==='dawn'||s.look==='golden'){ if(!g.src.endsWith(src)){g.src=src;waits.push(g.decode().catch(()=>{}));} }
  const k=lin(t,s.t0,s.t1),z=s.z[0]+(s.z[1]-s.z[0])*k; f.style.transform=g.style.transform='scale('+z+')';
  looks(el,s.look,t,s);
 });
 // opening black, top caption
 $('black').style.opacity=1-sm(lin(t,0,1.4)) + sm(lin(t,53.2,54.0));
 $('top').style.opacity=.9*sm(lin(t,.6,1.4))*(1-sm(lin(t,6.6,7.6)));
 // publisher + game logo over the night map
 const mg=sm(lin(t,1.0,2.0))*(1-sm(lin(t,4.0,4.6)));
 $('mg').style.opacity=mg; $('mg').style.filter='blur('+((1-sm(lin(t,1.0,2.2)))*10)+'px)';
 $('mg').style.transform='translate(-50%,-50%) scale('+(0.96+0.04*sm(lin(t,1,4.6)))+')';
 const ei=sm(lin(t,5.0,5.9))*(1-sm(lin(t,7.7,8.3)));
 $('eri').style.opacity=ei; $('eri').style.filter='blur('+((1-sm(lin(t,5.0,6.1)))*12)+'px) drop-shadow(0 0 40px rgba(255,220,150,.25))';
 $('eri').style.transform='translate(-50%,-50%) scale('+(0.9+0.1*sm(lin(t,5,8.3)))+')';
 // darken the map behind logos
 shotEls[0].querySelector('img.f').style.filter+=' brightness('+(1-.35*Math.max(mg,ei))+')';
 // kinetic text
 const line=TEXT.find(L=>t>=L.w[0][1]&&t<L.t1);
 const tx=$('txt');
 if(!line){tx.innerHTML='';}
 else{
  const out=line.cut?1:1-sm(lin(t,line.t1-.45,line.t1));
  tx.innerHTML=line.w.map(([w,a])=>{const k=sm(lin(t,a,a+.55));
   const c=Math.round(150+105*sm(lin(t,a+.15,a+.7)));
   return '<span style="opacity:'+(k*out)+';filter:blur('+((1-k)*9)+'px);transform:translateY('+((1-k)*14)+'px);color:rgb('+c+','+c+','+c+')">'+w+'</span>';}).join('');
  tx.style.fontSize=(line.w[0][0].length>9?70:76)+'px';
 }
 // scrim behind text on bright shots
 const bright=(t>=13.2&&t<29.4)||(t>=41.4&&t<47);
 $('scrim').style.opacity=(line&&bright)?1:0;
 // year counter during the growth montage
 const Y=[...YEARS].reverse().find(y=>t>=y[0]);
 if(Y&&t<36.6){ $('year').style.opacity=sm(lin(t,31.8,32.1))*(1-sm(lin(t,36.3,36.6)));
   $('year').innerHTML='<small>'+Y[2]+'</small>'+Y[1]; } else $('year').style.opacity=0;
 // watermark
 $('wm').style.opacity=.85*sm(lin(t,8.4,9.0))*(1-sm(lin(t,46.4,47.2)));
 // white out from the dawn zoom into the end card
 $('white').style.opacity=sm(lin(t,46.6,47.6));
 const e=t>=47.4; $('end').style.opacity=e?1:0;
 if(e){const b=document.querySelector('#end .banner'),k=sm(lin(t,47.7,48.9));
  b.style.opacity=k;b.style.filter='blur('+((1-k)*14)+'px)';b.style.transform='translate(-50%,-50%) scale('+(0.94+0.06*sm(lin(t,47.7,53.5)))+')';
  const s2=document.querySelector('#end .soon'),k2=sm(lin(t,49.5,50.3));s2.style.opacity=k2;s2.style.transform='translateY('+((1-k2)*16)+'px)';
  document.querySelector('#end .pub').style.opacity=.9*sm(lin(t,50.4,51.2));}
 await Promise.all(waits);
}
window.render=render; window.DURATION=54.0;
</script></body></html>
