<html lang="ko"><head><meta charset="utf-8">

<style>

html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}

.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.shot img.f{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}

.vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.ghost{position:absolute;inset:0;opacity:0;pointer-events:none}
.ghost .cr{position:absolute;overflow:hidden}
.ghost .cr img{position:absolute;width:1920px;height:1080px;max-width:none}
.ghost .tick{transform-origin:0 100%}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse 46% 26% at 50% 50%,rgba(10,14,22,.62),rgba(10,14,22,.25) 55%,transparent 100%);opacity:0}

#era .hd b{display:block;font-weight:600;font-size:58px;letter-spacing:-.01em;margin-top:8px}
#era .hd u{display:block;text-decoration:none;font-weight:400;font-size:24px;color:rgba(27,34,48,.65);margin-top:8px}

#era .st{position:absolute;left:122px;bottom:140px;font-family:W,P;font-weight:400;font-size:28px;color:rgba(27,34,48,.7);font-variant-numeric:tabular-nums;line-height:1.7}

/* ---------- feature glimpses ---------- */
#feat{position:absolute;inset:0;perspective:1600px}
.win{position:absolute;left:50%;top:47%;opacity:0;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);transform-style:preserve-3d}
.win .cr{position:relative;overflow:hidden}
.win .cr img{position:absolute;max-width:none}
.flab{position:absolute;left:96px;bottom:96px;font-family:W,P;color:#fff;opacity:0;text-shadow:0 2px 20px rgba(0,0,0,.5)}

/* ---------- ending: in-game network bursts out of Seoul, then the ER mark ---------- */
#grow{position:absolute;inset:0;opacity:0;background:#94BFE8}

<script>
const FPS=30, DUR=42.6;
const NOTEXT=new URLSearchParams(location.search).has('notext');
const CLIPS='clips/';
const N={v3_night_wide:270,v3_night_seoul:140,v3_golden:186,v3_skins:110,build:240,v3_feat_bg:150,
 v3_chrome_night:130,v3_chrome_golden:186,v3_win_research:48,v3_win_commission:48,v3_win_policy:48,v3_win_finance:48,endA:66,endB:66};
const fr=(c,i)=>CLIPS+(c.startsWith('end')?'mg4/':'')+c+'/'+String(Math.max(0,Math.min(N[c]-1,i))).padStart(4,'0')+'.jpg';
const ERA4=/*ERADATA*/null;
const END4=/*ENDDATA*/null;
const RECT=/*RECTS*/null;

const SHOTS=[
 {c:'v3_night_wide', t0:3.3,  t1:7.9,  f0:0, fi:1.0,fo:.4, look:'night', z:[1.0,1.03]},
 {c:'v3_night_seoul',t0:7.5,  t1:12.0, f0:0, fi:.4, fo:0,  look:'night', z:[1.02,1.06]},

 {t1:20.4, w:[['Connect your way',19.2]], cut:1},
 {t1:21.6, w:[['당신답게 잇다',20.4]], cut:1},
 {t1:25.0, w:[['쉽게 잇다',22.0]]},
 {t1:38.1, w:[['모든 선은',36.15],['당신에게서 시작된다',36.6]], cls:'ink', ink:1},
];
const FEAT=[
 {lab:'연구',en:'RESEARCH',   sk:'cassette 스킨',t0:31.2,t1:32.45,c:'v3_win_research',w:1040},
 {lab:'의뢰',en:'COMMISSIONS',sk:'sketch 스킨',  t0:32.4,t1:33.65,c:'v3_win_commission',w:720,ch:760,scroll:1},
 {lab:'정책',en:'POLICY',     sk:'paper 스킨',   t0:33.6,t1:34.85,c:'v3_win_policy',w:820},
 {lab:'경영',en:'MANAGEMENT', sk:'widget 스킨',  t0:34.8,t1:36.0, c:'v3_win_finance',w:900},
];

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sm=x=>{x=cl(x);return x*x*(3-2*x);};
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eout=x=>{x=cl(x);return 1-Math.pow(1-x,3);};
const eout5=x=>{x=cl(x);return 1-Math.pow(1-x,5);};
const back=x=>{x=cl(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const mk=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;};
const waits=[];
function setSrc(img,src){if(!img.getAttribute('src')||!img.getAttribute('src').endsWith(src)){img.src=src;waits.push(img.decode().catch(()=>{}));}}
function setHref(el,src){if(el.getAttribute('href')!==src){el.setAttribute('href',src);}}
const fade=(t,a,b,fi,fo)=>(t<a||t>=b)?0:Math.min(fi?sm(lin(t,a,a+fi)):1,fo?sm(1-lin(t,b-fo,b)):1);
const kkey=(a,b)=>a<b?a+'_'+b:b+'_'+a;

// ---------- shots / ghosts / features ----------
const shotEls=SHOTS.map(s=>{const d=document.createElement('div');d.className='shot';
 d.innerHTML='<img class="f"><img class="glow"><div class="grade"></div><div class="vig"></div>';$('shots').appendChild(d);return d;});
const ghostEls=GHOSTS.map(g=>{const d=document.createElement('div');d.className='ghost';d.style.mixBlendMode=g.mode;
 d.innerHTML=['L','R'].map(k=>{const r=CR[k];return '<div class="cr" style="left:'+r[0]+'px;top:'+r[1]+'px;width:'+r[2]+'px;height:'+r[3]+'px"><img style="left:'+(-r[0])+'px;top:'+(-r[1])+'px"></div>';}).join('')
  +'<div class="cr tick" style="left:60px;top:'+(1080-60-51)+'px;width:600px;height:51px;transform:scale(1.75)"><img style="left:-205px;top:-1029px"></div>';
 $('ghosts').appendChild(d);return d;});
const featEls=FEAT.map(f=>{const r=RECT[f.c],s=f.w/r[2],hh=f.ch?Math.min(f.ch,r[3]*s):r[3]*s;const d=document.createElement('div');d.className='win';
 d.innerHTML='<div class="cr" style="width:'+f.w+'px;height:'+hh+'px'+(f.ch?';-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent)':'')+'"><img style="width:'+(1920*s)+'px;height:'+(1080*s)+'px;left:'+(-r[0]*s)+'px;top:'+(-r[1]*s)+'px"></div>';
 f.s=s;f.hh=hh;f.rh=r[3]*s;$('feat').appendChild(d);
 const l=document.createElement('div');l.className='flab';l.innerHTML='<b>'+f.lab+'</b><i>'+f.en+'</i><u>'+f.sk+'</u>';$('feat').appendChild(l);f.labEl=l;return d;});
function looks(el,look,t,s){
 const f=el.querySelector('img.f'),g=el.querySelector('img.glow'),gr=el.querySelector('.grade'),v=el.querySelector('.vig');
 f.style.filter='';g.style.opacity=0;gr.style.background='';gr.style.mixBlendMode='';gr.style.opacity=1;v.style.opacity=0;
 if(look==='night'){f.style.filter='contrast(1.08) saturate(1.15)';g.style.opacity=.55;v.style.opacity=1;
   gr.style.background='radial-gradient(ellipse 90% 60% at 50% 0%,rgba(40,90,140,.35),transparent 70%)';gr.style.mixBlendMode='screen';}
 if(look==='golden'){f.style.filter='sepia(.55) saturate(1.7) contrast(1.18) brightness(.78)';v.style.opacity=1;g.style.opacity=.3;
   gr.style.background='radial-gradient(circle at 64% 16%,rgba(255,236,170,.95),rgba(255,170,80,.0) 38%),linear-gradient(180deg,rgba(255,176,92,1) 0%,rgba(226,110,48,1) 46%,rgba(70,28,22,1) 100%)';
   gr.style.mixBlendMode='multiply';gr.style.opacity=.85;}
 if(look==='clean'){f.style.filter='contrast(1.04) saturate(1.08)';v.style.opacity=.55;}
 if(look==='ui'){f.style.filter='contrast(1.03) saturate(1.05)';v.style.opacity=.35;}
 if(look==='featbg'){f.style.filter='brightness(.55) saturate(1.1) blur(3px)';g.style.opacity=.35;v.style.opacity=1;}
}

// ---------- reveal masks: a thick stroke sweeps each new segment of the game's own map ----------
function revealWidth(L){return Math.min(150,Math.max(44,22+.8*L));}
function bfsOrder(nets,seeds){ // depth of every node from the seed set over the given network
 const adj={};nets.forEach(l=>{for(let q=0;q<l.s.length-1;q++){const a=l.s[q],b=l.s[q+1];(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);}});
 const d={},Q=[];seeds.forEach(s=>{if(adj[s]){d[s]=0;Q.push(s);}});
 if(!Q.length){const any=+Object.keys(adj)[0];d[any]=0;Q.push(any);}
 while(Q.length){const u=Q.shift();(adj[u]||[]).forEach(v=>{if(d[v]==null){d[v]=d[u]+1;Q.push(v);}});}
 return d;}

// ---------- era: 1960 → 1975 → 1990 → 2005 → 2030 on the game's map ----------
const ERAS=[
 {t0:25.2,t1:26.7,y0:1960,y1:1975,st:'s1',tag:'1챕터 · 1960–1975',title:'창업과 첫 간선',desc:'선로 한 줄 없이 출발합니다'},
 {t0:26.7,t1:27.6,y0:1975,y1:1990,st:'s2',tag:'2챕터 · 1975–1990',title:'전철화와 도로 방어',desc:'도로가 철도의 손님을 빼앗기 시작합니다'},
 {t0:27.6,t1:28.5,y0:1990,y1:2005,st:'s3',tag:'3챕터 · 1990–2005',title:'고속철 건설',desc:'고속철도의 시대가 열립니다'},
 {t0:28.5,t1:31.2,y0:2005,y1:2030,st:'s4',tag:'4챕터 · 2005–2030',title:'그리고 당신의 노선',desc:'남해안선 · 동해선 · 강원 북부선 · 수도권 순환선 …'},
];
const EP=i=>[ERA4.ct[i][1],ERA4.ct[i][2]];
const ERA_IMG={};['s0','s1','s2','s3','s4'].forEach(k=>{const im=new Image();im.src='clips/mg4/era_'+k+'.jpg';ERA_IMG[k]=im;});
const MASK=document.createElement('canvas');MASK.width=1920;MASK.height=1080;const mctx=MASK.getContext('2d');
{let prevKeys=new Set(),prevNodes=new Set();
 const seoul=ERA4.ct.findIndex(c=>c[0]==='서울');
 const kmpp=325/Math.hypot(EP(seoul)[0]-EP(ERA4.ct.findIndex(c=>c[0]==='부산'))[0],EP(seoul)[1]-EP(ERA4.ct.findIndex(c=>c[0]==='부산'))[1]);
 ERAS.forEach((E,k)=>{const nets=ERA4.nets[E.st];
  const seeds=prevNodes.size?[...prevNodes]:[seoul];const dep=bfsOrder(nets,seeds);const maxD=Math.max(1,...Object.values(dep));
  E.segs=[];const seen=new Set();
  nets.forEach(l=>{for(let q=0;q<l.s.length-1;q++){let a=l.s[q],b=l.s[q+1];const kk=kkey(a,b);if(prevKeys.has(kk)||seen.has(kk))continue;seen.add(kk);
    if((dep[a]??99)>(dep[b]??99))[a,b]=[b,a];
    const A=EP(a),B=EP(b),L=Math.hypot(B[0]-A[0],B[1]-A[1]);
    const span=Math.min(1.5,(E.t1-E.t0)*.62),s0=E.t0+.04+((dep[a]??maxD)/maxD)*span,dur=.13+Math.min(.12,L/2400);
    E.segs.push({A,B,L,w:revealWidth(L),s0,dur});}});
  E.nodes=new Set(nets.flatMap(l=>l.s));E.lines=nets.filter(l=>l.s.length>1).length;
  const allK=new Set();nets.forEach(l=>{for(let q=0;q<l.s.length-1;q++)allK.add(kkey(l.s[q],l.s[q+1]));});
  E.km=0;allK.forEach(x=>{const [a,b]=x.split('_').map(Number);E.km+=Math.hypot(EP(a)[0]-EP(b)[0],EP(a)[1]-EP(b)[1])*kmpp*1.18;});
  prevKeys=new Set([...prevKeys,...allK]);prevNodes=new Set([...prevNodes,...E.nodes]);});}
function stageDraw(ctx,img,segs,t,full){ // draw img through a mask made of swept strokes
 mctx.globalCompositeOperation='source-over';mctx.clearRect(0,0,1920,1080);mctx.lineCap='round';mctx.strokeStyle='#fff';let any=false;
 segs.forEach(s=>{const v=eout(lin(t,s.s0,s.s0+s.dur));if(v<=0)return;any=true;mctx.lineWidth=s.w;mctx.beginPath();
  mctx.moveTo(s.A[0],s.A[1]);mctx.lineTo(s.A[0]+(s.B[0]-s.A[0])*v,s.A[1]+(s.B[1]-s.A[1])*v);mctx.stroke();});
 if(full>0){mctx.globalAlpha=full;mctx.fillStyle='#fff';mctx.fillRect(0,0,1920,1080);mctx.globalAlpha=1;any=true;}
 if(!any)return;mctx.globalCompositeOperation='source-in';mctx.drawImage(img,0,0,1920,1080);mctx.globalCompositeOperation='source-over';ctx.drawImage(MASK,0,0);}
[1960,1975,1990,2005,2030].forEach(y=>{const s=document.createElement('span');s.textContent=y;s.style.left=((y-1960)/70*100)+'%';document.querySelector('#era .tl').appendChild(s);});
function eraRender(t){
 const o=fade(t,25.2,31.2,0,.35);$('era').style.opacity=o;if(!o)return;
 let k=0;ERAS.forEach((e,i)=>{if(t>=e.t0)k=i;});const E=ERAS[k];
 const ctx=$('eraCv').getContext('2d');ctx.drawImage(ERA_IMG.s0,0,0,1920,1080);
 ERAS.forEach(e=>{if(t<e.t0-.01)return;stageDraw(ctx,ERA_IMG[e.st],e.segs,t,sm(lin(t,e.t1-.32,e.t1-.12)));});
 // punch-in at every chapter, flash, slam the year
 const pk=lin(t,E.t0,E.t0+.45);$('eraCv').style.transform='scale('+(1+.045*(1-eout(pk)))+')';
 document.querySelector('#era .flash').style.opacity=.35*(1-eout(lin(t,E.t0,E.t0+.22)))*(k>0?1:.6);
 const ry=eout5(lin(t,E.t0+.02,Math.min(E.t1-.2,E.t0+1.6)));const yr=Math.round(E.y0+(E.y1-E.y0)*ry);
 const Y=document.querySelector('#era .yr');Y.textContent=yr;const sk=lin(t,E.t0,E.t0+.25);Y.style.transform='scale('+(1+.22*(1-eout(sk)))+')';
 const hd=document.querySelector('#era .hd');hd.children[0].textContent=E.tag;hd.children[1].textContent=E.title;hd.children[2].textContent=E.desc;
 const hk=eout(lin(t,E.t0,E.t0+.25));hd.style.opacity=hk;hd.style.transform='translateX('+((1-hk)*-30)+'px)';
 document.querySelector('#era .tl .fill').style.width=((yr-1960)/70*100)+'%';
 const pv=k?ERAS[k-1]:{lines:0,km:0,nodes:new Set()};const r=E.segs.length?E.segs.reduce((a,x)=>a+eout(lin(t,x.s0,x.s0+x.dur)),0)/E.segs.length:1;
 const nl=Math.round(pv.lines+(E.lines-pv.lines)*r),ns=Math.round(pv.nodes.size+(E.nodes.size-pv.nodes.size)*r),nk=Math.round(pv.km+(E.km-pv.km)*r);
 document.querySelector('#era .st').innerHTML='노선<b>'+nl+'</b><br>역<b>'+ns+'</b><br>선로<b>'+nk.toLocaleString()+'</b>km';
}

// ---------- ending part 1: the 2030 network bursts out of Seoul on the game's map ----------
const G0=36.0,GN=66;
const gSegs=[];{const net=END4.net;
 const sIdx=ERA4.ct.findIndex(c=>c[0]==='서울');const dep=bfsOrder(net,[sIdx]);const maxD=Math.max(...Object.values(dep));const seen=new Set();
 net.forEach(l=>{for(let q=0;q<l.s.length-1;q++){let a=l.s[q],b=l.s[q+1];const kk=kkey(a,b);if(seen.has(kk))continue;seen.add(kk);if((dep[a]??99)>(dep[b]??99))[a,b]=[b,a];
   gSegs.push({a,b,s0:G0+.12+((dep[a]??maxD)/maxD)*1.05,dur:.14});}});}
function gScr(i,c){const p=END4.pos[i];return [(p[0]*c.ms*c.sc+c.px)*1.5,(p[1]*c.ms*c.sc+c.py)*1.5];}
function growRender(t){
 const o=(t>=G0&&t<38.0)?1:0;$('grow').style.opacity=o;if(!o)return;
 const i=Math.min(GN-1,Math.floor((t-G0)*FPS)),c=END4.cams[i];
 setSrc($('gA'),fr('endA',i));setSrc($('gB'),fr('endB',i));
 const segs=gSegs.map(s=>{const A=gScr(s.a,c),B=gScr(s.b,c),L=Math.hypot(B[0]-A[0],B[1]-A[1]);return {A,B,L,w:revealWidth(L),s0:s.s0,dur:s.dur};});
 GROW.push(()=>{const ctx=$('growCv').getContext('2d');ctx.drawImage($('gA'),0,0,1920,1080);stageDraw(ctx,$('gB'),segs,t,sm(lin(t,37.25,37.45)));});
}
const GROW=[];
// ---------- ending part 2: lines assemble the ER mark (logo units, 1024 grid) ----------
const ERP=[
 {c:'#2F80ED',d:'M437,178 H269 A128,128 0 0 0 141,306 V717 A128,128 0 0 0 269,845 H437',t0:37.95,t1:38.62},
 {c:'#EF6B54',d:'M610,845 V306 A128,128 0 0 1 738,178 H815 A128,128 0 0 1 943,306 V365 A128,128 0 0 1 815,493 H640',t0:38.05,t1:38.72},
 {c:'#E0A82E',d:'M204,543 H437',t0:38.3,t1:38.62},
 {c:'#1F9367',d:'M672,555 H803 A128,128 0 0 1 931,683 V845',t0:38.35,t1:38.72},
];
const PILLS=[{cx:173,cy:511.5,d1:[142,480,'#2F80ED'],d2:[204,543,'#E0A82E'],t:38.76},{cx:641.5,cy:523.5,d1:[610,492,'#EF6B54'],d2:[673,555,'#1F9367'],t:38.86}];
const erG=$('er');const erIn=mk('g',{},erG);
ERP.forEach(p=>{p.els=[['#DDE2E9',80],['#fff',59],[p.c,39]].map(([c,w])=>mk('path',{d:p.d,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'},erIn));
 p.L=p.els[0].getTotalLength();p.els.forEach(e=>{e.setAttribute('stroke-dasharray',p.L+' '+(p.L+200));e.setAttribute('stroke-dashoffset',p.L);});});
PILLS.forEach(q=>{q.g=mk('g',{opacity:0},erIn);const r=70.5,s=44;
 mk('rect',{x:-s-r,y:-r,width:2*s+2*r,height:2*r,rx:r,fill:'#fff',stroke:'#000','stroke-width':26},q.g);
 [q.d1,q.d2].forEach(([x,y,c])=>{const dx=x-q.cx,dy=y-q.cy,c45=Math.SQRT1_2,lx=dx*c45+dy*c45,ly=-dx*c45+dy*c45;mk('circle',{cx:lx,cy:ly,r:29,fill:c},q.g);});});
const wmEl=document.querySelector('#fin .wordmark'),relEl=document.querySelector('#fin .rel');
const ER_W=904,ER_CX=510,ER_CY=511.5,WM_H=232,WM_W=WM_H*1386/448,MARK_S1=.30,GAP=56;
const totalW=ER_W*MARK_S1+GAP+WM_W,X0=(1920-totalW)/2,Y0=470;
wmEl.style.width=WM_W+'px';wmEl.style.left=(X0+ER_W*MARK_S1+GAP)+'px';wmEl.style.top=(Y0-WM_H/2)+'px';
relEl.style.left=(X0+ER_W*MARK_S1+GAP+10)+'px';relEl.style.top=(Y0+WM_H/2+34)+'px';
function finRender(t){
 const o=sm(lin(t,37.5,37.95));$('fin').style.opacity=o;if(!o)return;
 ERP.forEach(p=>{const k=eio(lin(t,p.t0,p.t1));p.els.forEach(e=>e.setAttribute('stroke-dashoffset',p.L*(1-k)));});
 PILLS.forEach(q=>{const k=lin(t,q.t,q.t+.3),s=k<=0?0:back(k);q.g.setAttribute('opacity',k>0?1:0);
   q.g.setAttribute('transform','translate('+q.cx+','+q.cy+') rotate(45) scale('+s+')');});
 const mv=eio(lin(t,39.35,40.05)),s0=.78,s1=MARK_S1,s=s0+(s1-s0)*mv;
 const pop=1+.05*Math.sin(Math.PI*lin(t,38.86,39.2));
 const cx=960+((X0+ER_W*s1/2)-960)*mv,cy=540+(Y0-540)*mv,S=s*pop;
 erG.setAttribute('transform','translate('+(cx-ER_CX*S)+','+(cy-ER_CY*S)+') scale('+S+')');
 const wk=sm(lin(t,39.75,40.3));wmEl.style.opacity=wk;wmEl.style.transform='translateX('+((1-wk)*-24)+'px)';
 const rk=sm(lin(t,40.3,40.8));relEl.style.opacity=rk;relEl.style.transform='translateY('+((1-rk)*10)+'px)';
}

// external clock -> internal timeline: the 2030 chapter plays 1.5x faster and everything after it moves up 0.9 s
const WARP=t=>t<28.5?t:(t<30.3?28.5+(t-28.5)*1.5:t+0.9);
async function render(tExt){
 const t=WARP(tExt);
 waits.length=0;
 SHOTS.forEach((s,i)=>{const el=shotEls[i];const o=fade(t,s.t0,s.t1,s.fi,s.fo);el.style.opacity=o;if(!o)return;
  const src=fr(s.c,s.f0+Math.floor((t-s.t0)*FPS+1e-6));const f=el.querySelector('img.f'),g=el.querySelector('img.glow');setSrc(f,src);
  if(['night','golden','featbg'].includes(s.look))setSrc(g,src);
  const k=lin(t,s.t0,s.t1),z=s.z[0]+(s.z[1]-s.z[0])*k;f.style.transform=g.style.transform='scale('+z+')';looks(el,s.look,t,s);});
 GHOSTS.forEach((g,i)=>{const el=ghostEls[i];const o=fade(t,g.t0,g.t1,.6,.5)*g.op;el.style.opacity=o;if(!o)return;
  const src=fr(g.c,g.f0+Math.floor((t-g.t0)*FPS));el.querySelectorAll('img').forEach(im=>setSrc(im,src));
  el.style.filter='blur(.5px)';el.style.transform='scale('+(1.0+.015*lin(t,g.t0,g.t1))+')';});
 $('black').style.opacity=sm(lin(t,42.0,42.6));
 const mg=sm(lin(t,.5,1.3))*(1-sm(lin(t,2.7,3.3)));$('mg').style.opacity=mg;$('mg').style.transform='translate(-50%,-50%) scale('+(0.97+0.03*lin(t,.5,3.3))+')';
 const ei=sm(lin(t,4.6,5.3))*(1-sm(lin(t,7.1,7.7)));$('eri').style.opacity=ei;$('eri').style.transform='translate(-50%,-50%) scale('+(0.94+0.06*eout(lin(t,4.6,7.7)))+')';
 const dim=1-.36*(1-sm(lin(t,7.2,7.9)));shotEls[0].querySelector('img.f').style.filter+=' brightness('+dim+')';
 $('top').style.opacity=.9*sm(lin(t,4.0,4.6))*(1-sm(lin(t,6.8,7.4)));
 const line=NOTEXT?null:TEXT.find(L=>t>=L.w[0][1]&&t<L.t1),tx=$('txt');
 tx.className=line&&line.cls?line.cls:'';
 if(!line)tx.innerHTML='';
 else{const out=line.cut?1:1-sm(lin(t,line.t1-.45,line.t1));
  tx.innerHTML=line.w.map(([w,a])=>{const k=sm(lin(t,a,a+.45)),c=line.ink?Math.round(150-118*sm(lin(t,a+.1,a+.55))):Math.round(150+105*sm(lin(t,a+.15,a+.7)));
   return '<span style="opacity:'+(k*out)+';filter:blur('+((1-k)*9)+'px);transform:translateY('+((1-k)*14)+'px);color:rgb('+c+','+c+','+(c+(line.ink?6:0))+')">'+w+'</span>';}).join('');
  tx.style.fontSize=(line.w[0][0].length>9?70:76)+'px';}
 const bright=(t>=12&&t<25.2);$('scrim').style.opacity=(line&&bright)?1:0;
 eraRender(t);
 FEAT.forEach((f,i)=>{const el=featEls[i],o=fade(t,f.t0,f.t1+(i<FEAT.length-1?.08:0),.12,.1);el.style.opacity=o;f.labEl.style.opacity=o;if(!o)return;const k=lin(t,f.t0,f.t1);
  const im=el.querySelector('img');setSrc(im,fr(f.c,6+Math.floor((t-f.t0)*FPS)));
  if(f.scroll)im.style.transform='translateY('+(-k*Math.max(0,f.rh-f.hh)*.55)+'px)';
  el.style.transform='translate(-50%,-50%) rotateY('+(-9+6*k)+'deg) rotateX(3deg) scale('+(0.95+0.06*k)+')';
  f.labEl.style.transform='translateY('+((1-sm(lin(t,f.t0,f.t0+.4)))*16)+'px)';});
 $('wm').style.opacity=.85*sm(lin(t,7.8,8.4))*(1-sm(lin(t,35.6,36.0)))*(t>=25.2&&t<31.2?0:1);
 growRender(t);
 finRender(t);
 await Promise.all(waits);
 while(GROW.length)GROW.shift()();
}
window.render=render;window.DURATION=DUR-0.9;
window.READY=Promise.all(Object.values(ERA_IMG).map(im=>im.decode()));
