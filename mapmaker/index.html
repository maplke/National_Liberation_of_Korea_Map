<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everyline 맵 제작기</title>
<style>
:root{
 --bg:#f3f4f2;--panel:#ffffff;--panel2:#f7f8f6;--line:#d9dcd6;--line2:#c3c7bf;
 --ink:#1d211c;--ink2:#5b6158;--ink3:#8a9086;--acc:#1f7a4d;--acc2:#e7f3ec;--warn:#b26a00;--bad:#c23b2a;--ok:#1f7a4d;
 --sea:#96c0ea;--mapbg:#dfe6ec;--sel:#e0a020;
 --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#151815;--panel:#1d211d;--panel2:#242924;--line:#323831;--line2:#454c44;
 --ink:#e6eae4;--ink2:#a9b0a6;--ink3:#7c847a;--acc:#5cc98e;--acc2:#1f3328;--warn:#e0a020;--bad:#ff6a4a;--ok:#5cc98e;--mapbg:#0f1310;--sel:#ffc23d;}}
:root[data-theme="dark"]{
 --bg:#151815;--panel:#1d211d;--panel2:#242924;--line:#323831;--line2:#454c44;
 --ink:#e6eae4;--ink2:#a9b0a6;--ink3:#7c847a;--acc:#5cc98e;--acc2:#1f3328;--warn:#e0a020;--bad:#ff6a4a;--ok:#5cc98e;--mapbg:#0f1310;--sel:#ffc23d;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700;white-space:nowrap}
header h1 small{font-weight:400;color:var(--ink3);margin-left:6px;font-size:11px}
header .sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:4px 10px;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:2px 7px;font-size:12px}
.btn.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.bad{color:var(--bad)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:11px;text-align:center;background:var(--bad);color:#fff;margin-left:4px}
.badge.ok{background:var(--ok)}
.main{display:grid;grid-template-columns:minmax(220px,270px) 1fr minmax(270px,340px);min-height:0}
.left,.right{background:var(--panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1 1 30%;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 4px;font-size:12px}
.tabs button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.02em}
.sec p.hint,.hint{color:var(--ink3);font-size:12px;margin:4px 0}
.lst{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:6px;padding:5px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.li:hover{background:var(--panel2)}
.li.on{background:var(--acc2)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{color:var(--ink3);font-size:11px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.row{display:flex;align-items:center;gap:6px;margin:5px 0;flex-wrap:wrap}
.row>label{flex:0 0 92px;color:var(--ink2);font-size:12px}
.row>.f{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:4px 6px}
input[type=number]{font-family:var(--mono)}
textarea{font-family:var(--mono);font-size:12px;resize:vertical;min-height:60px}
input[type=checkbox]{accent-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.grid2 .row>label{flex-basis:auto;min-width:46px}
.center{position:relative;min-width:0;min-height:0;background:var(--mapbg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.toolbar{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px);z-index:3}
.toolbar .btn{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.status{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:10px;font-size:11px;color:var(--ink2);pointer-events:none;z-index:3}
.status span{background:var(--panel);padding:2px 7px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sw{display:inline-block;width:22px;height:22px;border-radius:4px;border:2px solid var(--line2);vertical-align:middle;cursor:pointer}
.sw.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.msg{padding:6px 8px;border-radius:5px;margin:4px 0;font-size:12px;line-height:1.45}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.msg.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.msg.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.goal{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;background:var(--panel2)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;background:var(--panel2)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg .box{background:var(--panel);border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg h2{margin:0 0 10px;font-size:16px}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;background:var(--panel2)}
.opt:hover,.opt.on{border-color:var(--acc)}
.opt b{display:block}
.opt span{color:var(--ink3);font-size:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:6px;z-index:60;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);margin:1px}
code{font-family:var(--mono);font-size:11.5px;background:var(--panel2);padding:0 3px;border-radius:3px}
@media (max-width:900px){
 .main{grid-template-columns:1fr;grid-template-rows:auto 55vh auto}
 .left,.right{border:none;max-height:none}
 .left{order:1}.center{order:2}.right{order:3}
}
</style>
</head>
<body>
<div class="app">
<header>
 <h1>Everyline 맵 제작기<small id="hVer"></small></h1>
 <button class="btn" id="bNew">새 지도</button>
 <button class="btn" id="bOpen">열기</button>
 <button class="btn" id="bUndo" title="되돌리기 (Ctrl+Z)">↶</button>
 <button class="btn" id="bRedo" title="다시 하기 (Ctrl+Y)">↷</button>
 <span class="sp"></span>
 <span id="hName" class="hint"></span>
 <button class="btn" id="bCheck">검증<span class="badge" id="hBadge">0</span></button>
 <button class="btn pri" id="bExport">시나리오 JSON 내보내기</button>
 <input type="file" id="fOpen" accept=".json,application/json" hidden>
 <input type="file" id="fImg" accept="image/*" hidden>
</header>
<div class="main">
 <aside class="left" id="left"></aside>
 <section class="center">
  <canvas id="cv"></canvas>
  <div class="toolbar" id="toolbar"></div>
  <div class="status"><span id="stPos">–</span><span id="stTool"></span></div>
 </section>
 <aside class="right" id="right"></aside>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
/* 자동 생성 · tools/extract.js · 원본 everyline-rail 0.19.0-b114
   게임 로더의 validScen을 그대로 옮긴 것이다. 손으로 고치지 말고 다시 뽑는다(지시서 10-6). */
const GAME_VER="0.19.0-b114";
const METRIC={dblRatio:1,hsKm:1,connSmall:1,metroShare:1,longShare:1,profit3:1,debtRatio:1,pax:1,debt:1,cash:1,lines:1,year:1,fareLv:1};
const KT=[['build','건설비',1],['time','공사 기간',1],['trk','선로 유지비',1],['st','역 유지비',1],
 ['veh','차량비',0],['run','주행비',0],['rsp','연구 속도',0],['rc','연구비',0],
 ['acc','사고율',1],['permit','인허가 기간',1]];
const PCOND=['yr','res','dec','ev','opin','gov','cash','net','loss'];
const PNET={km:['선로 연장','km'],elKm:['전철화 연장','km'],st:['역 수','곳']};
function KTo(k){return KT.find(x=>x[0]===k)||null;}
function efxN(e){return e&&e.t==='costMul'?Object.assign({},e,{t:'mul',k:'build'}):e;}   // 2-3 옛 비용 계수는 건설비로 읽는다
const EFX=['demandMul','nodeWeight','modeAvail','mul','techUnlock','cash','constraint','planCancel','trust'];
const QREQ=['link','serve','grade','freq','time','share','keep','metric'];   // 설계안 3-1 닫힌 목록
const QSRC={gov:'정부',loc:'지자체',biz:'기업'};                         // 2-1 닫힌 목록
const GKIND=['ratio','pax','km','money','lteRatio','lteMoney'];
const FST=['on','off','opt'];
function validScen(r){const e=[];
 if(!r||typeof r!=='object')return['시나리오 파일을 읽을 수 없습니다'];
 ['id','ver','title'].forEach(k=>{if(!r[k])e.push('필수 필드가 없습니다 · '+k);});
 if(!r.map||!r.map.src||!Array.isArray(r.map.proj)||r.map.proj.length!==6)
  e.push('지도 정의가 없거나 투영 계수가 여섯 개가 아닙니다');
 if(!Array.isArray(r.nodes)||!r.nodes.length)e.push('노드 배열이 없습니다');
 else{r.nodes.forEach((n,i)=>{if(!n||n.length<6)e.push((i+1)+'번 노드의 속성이 모자랍니다');});
  const seen={};
  r.nodes.forEach(n=>{if(!n)return;
   if(seen[n[0]])e.push('노드 이름이 겹칩니다 · '+n[0]);seen[n[0]]=1;});
  const has=nm=>r.nodes.some(x=>x&&x[0]===nm);
  r.nodes.forEach(n=>{const a=(n&&n[6])||null;if(!a)return;
   if(a.parent&&!has(a.parent))e.push('참조할 수 없는 부모 노드 · '+a.parent);
   if(a.unlock&&!has(a.unlock.by))e.push('참조할 수 없는 해금 기준 노드 · '+a.unlock.by);
   if(typeof a.pull==='string'&&!(r.pullProf&&r.pullProf[a.pull]!=null))
    e.push('알 수 없는 pull 프로필 · '+a.pull);});}
 if(!r.era||!Array.isArray(r.era.cpi)||!Array.isArray(r.era.pop))
  e.push('시대 곡선이 갖춰지지 않았습니다');
 if(!Array.isArray(r.modes))e.push('수단 테이블이 없습니다');
 else r.modes.forEach(m=>{if(!m.id||!m.nm)e.push('수단에 식별자나 이름이 없습니다');
  [['v',m.v],['acc',m.acc],['av',m.av]].forEach(([nm,c2])=>{
   if(!c2||['const','logi','ramp','pts'].indexOf(c2.t)<0)
    e.push(m.id+' 수단의 '+nm+' 곡선 종류가 목록 밖입니다');});});
 if(!r.tech||!Array.isArray(r.tech.sig))e.push('기술 표가 없습니다');
 // H단계 테크트리. 없으면 연구 창이 비고 해금 제약이 걸리지 않는다
 if(r.tech&&r.tech.tree!=null){const tr=r.tech.tree,ids={},ln={};
  if(!Array.isArray(tr))e.push('테크트리가 배열이 아닙니다');
  else{(r.tech.lanes||[]).forEach(l=>{ln[l[0]]=1;});tr.forEach(t=>{if(t&&t.id)ids[t.id]=1;});
   tr.forEach(t=>{if(!t||!t.id){e.push('식별자 없는 기술이 있습니다');return;}
    if(!ln[t.l])e.push('기술의 계통이 목록 밖입니다 · '+t.id);
    (t.p||[]).forEach(p=>{if(!ids[p])e.push('기술의 선행을 찾을 수 없습니다 · '+t.id+' ← '+p);});
    if(t.fx&&t.fx.sig!=null&&!r.tech.sig[t.fx.sig])e.push('기술이 없는 신호 등급을 가리킵니다 · '+t.id);
    if(t.fx&&t.fx.wipKm!=null&&!(t.fx.wipKm>0))e.push('동시 공사 한도 증가값이 양수가 아닙니다 · '+t.id);});
   if(r.veh&&Array.isArray(r.veh.list))r.veh.list.forEach(v=>{if(!v.id)e.push('식별자 없는 차종이 있습니다');
    else{if(v.r&&!ids[v.r])e.push('차종의 해금 연구를 찾을 수 없습니다 · '+v.id+' ← '+v.r);
     if(!(v.A>0&&v.V>0&&v.cap>0))e.push('차종의 가감속·속도·정원이 없습니다 · '+v.id);}});}}
 if(!r.presets||typeof r.presets!=='object')e.push('프리셋 망이 없습니다');
 if(!Array.isArray(r.chapters)||!r.chapters.length)e.push('챕터 정의가 없습니다');
 else r.chapters.forEach((c,i)=>{const t=(i+1)+'챕터';
  if(c.y0==null||c.y1==null)e.push(t+'에 연도 구간이 없습니다');
  if(c.cap==null)e.push(t+'에 시작자본이 없습니다');
  if(i===0){if(c.pre)e.push('첫 챕터는 프리셋 없이 무에서 시작해야 합니다');}
  else if(!r.presets||!r.presets[c.pre])e.push(t+'가 참조하는 프리셋을 찾을 수 없습니다 · '+c.pre);
  if(!Array.isArray(c.goals)||!c.goals.length)e.push(t+'에 목표가 없습니다');
  else{if(c.goals.length>3)e.push(t+'의 목표가 셋을 넘습니다');
   c.goals.forEach(g=>{if(!METRIC[g.m])e.push(t+'의 목표가 알 수 없는 지표를 참조합니다 · '+g.m);
    if(GKIND.indexOf(g.k)<0)e.push(t+'의 목표 판정 종류가 목록 밖입니다 · '+g.k);});}});
 if(r.events!=null&&!Array.isArray(r.events))e.push('이벤트 정의가 배열이 아닙니다');
 else (r.events||[]).forEach(v=>{
  if(!v.id)e.push('식별자 없는 이벤트가 있습니다');
  const efs=(v.efx||[]).concat((v.plan&&v.plan.done&&v.plan.done.efx)||[]);
  efs.forEach(x=>{if(EFX.indexOf(x.t)<0)
   e.push('효과 타입이 8-6 목록 밖입니다 · '+x.t);});
  if(v.kind==='plan'&&!v.plan)e.push('계획형 이벤트에 plan 정의가 없습니다 · '+v.id);
  if(v.cond&&v.cond.when&&!METRIC[v.cond.when.m])
   e.push('이벤트 조건이 알 수 없는 지표를 참조합니다 · '+v.id);
  if(v.kind!=null&&['plan','badge','era'].indexOf(v.kind)<0)e.push('이벤트 종류가 목록 밖입니다 · '+v.id+' · '+v.kind);
  if(v.cond&&v.cond.m!=null&&!(v.cond.m>=1&&v.cond.m<=12))e.push('이벤트 조건의 달이 1~12 밖입니다 · '+v.id);
  if(v.cond&&v.cond.after&&!(r.events||[]).some(x=>x&&x.id===v.cond.after))
   e.push('이벤트 조건이 없는 사건을 가리킵니다 · '+v.id+' → '+v.cond.after);});
 // 의뢰 시스템 설계안 3-3 · 부록 A 3-8
 if(r.quests!=null){if(!Array.isArray(r.quests))e.push('의뢰 정의가 배열이 아닙니다');
  else{const ids={},has=nm=>Array.isArray(r.nodes)&&r.nodes.some(x=>x&&x[0]===nm);
   r.quests.forEach(q=>{if(q&&q.id)ids[q.id]=1;});
   r.quests.forEach(q=>{const t='의뢰 '+((q&&q.id)||'?');
    if(!q||!q.id){e.push('식별자 없는 의뢰가 있습니다');return;}
    if(!QSRC[q.src])e.push(t+'의 발주처가 목록 밖입니다 · '+q.src);
    // 결정이 붙이는 틀 과제(tpl)는 자리와 요구를 붙는 순간 정한다(개편 지시서 3-1 · 3-5)
    if(q.mand!=null&&q.mand!==1&&q.mand!==2)e.push(t+'의 지정 표시(mand)는 1 또는 2입니다');
    if(q.tpl&&!(q.cond&&q.cond.dec))e.push(t+'는 틀 과제인데 결정 조건(dec)이 없습니다');
    if(!q.slot&&!q.tpl)e.push(t+'에 자리가 없습니다');
    if(!q.tpl&&(!Array.isArray(q.req)||!q.req.length||q.req.length>3))e.push(t+'의 요구는 1~3개여야 합니다');
    if(q.sub&&!ids[q.sub])e.push(t+'의 대체 의뢰를 찾을 수 없습니다 · '+q.sub);
    (q.req||[]).concat((q.alt&&q.alt.req)||[]).forEach(R=>{
     if(QREQ.indexOf(R.t)<0)e.push(t+'의 요구 타입이 목록 밖입니다 · '+R.t);
     ['a','b','st'].forEach(k=>{const v=R[k];(Array.isArray(v)?v:v!=null?[v]:[]).forEach(nm=>{
      if(!has(nm))e.push(t+'가 없는 노드를 가리킵니다 · '+nm);});});
     if(R.t==='metric'&&!METRIC[R.m])e.push(t+'의 지표를 알 수 없습니다 · '+R.m);
     if(R.t==='freq'&&R.v%10)e.push(t+'의 배차 기준이 10분 단위가 아닙니다');});
    const link=(q.req||[]).some(R=>R.t==='link');
    ['win','lose','no'].forEach(k=>(q[k]||[]).forEach(x=>{
     if(EFX.indexOf(x.t)<0)e.push(t+'의 효과 타입이 8-6 목록 밖입니다 · '+x.t);
     if(x.t==='cash'&&x.of==='est'&&!link)e.push(t+'가 선로 요구 없이 추정 공사비 보수를 씁니다');
     if(x.t==='trust'&&!QSRC[x.id])e.push(t+'의 신뢰 대상이 목록 밖입니다 · '+x.id);}));});}}
 // 정책 시스템 설계안 2-2 · 5-2 닫힌 목록 검증
 if(r.policy!=null){const p=r.policy,e2=m=>e.push('정책 · '+m);
  if(typeof p!=='object')e2('정의가 객체가 아닙니다');
  else{const reg={},tids={},bands={},pids={},dids={},evs={};
   (p.regs||[]).forEach(R=>{if(!R.id)e2('식별자 없는 권역이 있습니다');else reg[R.id]=1;});

v","tab","st1"],"bands":[["v","차량"],["c","토목"],["s","신호·운영"],["m","경영·정책"]],"desc":{"steam":"석탄을 때서 끓인 증기로 바퀴를 돌리는 기관차입니다. 철도의 첫 동력이지만 느리고 연료와 물을 자주 채워야 해서 차츰 디젤과 전기에 자리를 내줍니다.","dsl":"디젤 엔진으로 발전기를 돌려 전동기로 달리는 기관차입니다. 전철화 없이 어느 선로에나 들어갈 수 있어 전철화 전 간선의 주력이 됩니다.","dslh":"출력을 크게 키운 디젤기관차입니다. 시멘트 · 석탄 같은 무거운 화물과 긴 여객 편성을 한 대로 끌 수 있습니다.","dmu":"객차마다 엔진을 달아 기관차 없이 다니는 열차입니다. 짧게 묶어 자주 다니기 좋아 지선과 통근 구간에 맞습니다.","dhc":"유체 변속기를 쓴 디젤동차로, 가속이 좋고 객실이 조용해 우등 열차에 맞습니다.","ecoVeh":"배터리나 수소 연료전지로 달리는 동차입니다. 전철화가 어려운 지선에서 전기차에 가까운 성능을 냅니다.","eloco":"가공선의 전기로 달리는 기관차입니다. 전철화한 구간에서만 다니지만 험한 산악 구간에서 디젤보다 힘이 좋습니다.","elh":"출력을 높인 전기기관차와 그에 맞춘 변전 설비입니다. 장대 화물과 고속 여객을 같은 선로에서 소화합니다.","emu":"객차마다 전동기를 단 전기 열차입니다. 가속과 감속이 빨라 역이 촘촘한 도시 통근 노선에 맞습니다.","acdc":"교류 구간과 직류 구간을 모두 달릴 수 있는 전동차입니다. 전철 방식이 다른 두 노선을 한 노선으로 이어 달릴 때 필요합니다.","vvvf":"인버터로 전동기의 전압과 주파수를 함께 조절하는 제어 방식입니다. 전기를 덜 쓰고 정비가 쉬워 전동차의 표준이 되어 갑니다.","regen":"제동할 때 전동기를 발전기로 돌려 만든 전기를 가선으로 되돌려 다른 열차가 쓰게 하는 기술입니다.","dd":"위아래 두 층에 좌석을 둔 객차입니다. 같은 길이의 승강장에 더 많은 승객을 태우지만 타고 내리는 데 시간이 더 걸립니다.","hsc":"앞뒤 동력차가 가운데 객차를 끄는 고속열차입니다. 고속철도를 처음 놓을 때 흔히 이미 쓰이는 해외 기술을 들여옵니다.","hsk":"고속철도 기술을 국내에서 개발해 만든 고속열차입니다. 수입 차량보다 싸고 환율 변동에 흔들리지 않습니다.","tilt":"곡선에서 차체를 안쪽으로 기울여 속도를 줄이지 않고 지나가는 열차입니다. 고속선을 새로 놓지 않고 기존선을 빠르게 만드는 방법입니다.","hsd":"객차마다 동력을 나눠 단 고속열차입니다. 가속이 빠르고 좌석이 많아 역이 많은 노선에서도 손해가 적습니다.","conc":"나무 대신 콘크리트로 만든 침목입니다. 썩지 않고 무거워 선로가 덜 틀어지므로 유지보수가 줄어듭니다.","cwr":"레일 이음매를 용접해 수백 m를 한 줄로 이은 레일입니다. 덜컹거림이 사라져 승차감이 좋아지고 선로 정비도 줄어듭니다.","hsl":"시속 300km로 달릴 수 있게 곡선을 완만하게 하고 기울기를 낮춘 선로 기준입니다. 터널과 교량이 많아져 건설비가 가장 비쌉니다.","mech":"굴삭기 · 궤도부설기 같은 장비로 선로를 놓는 방식입니다. 사람 손에 의존하던 공사보다 한꺼번에 더 많은 구간을 공사할 수 있습니다.","prefab":"교량이나 터널의 마디를 공장에서 미리 만들어 현장에서 잇는 공법입니다. 공사 현장이 단순해져 동시에 맡을 수 있는 공사가 늘어납니다.","smartc":"설계를 3차원 정보 모델(BIM)로 관리하고 장비를 자동으로 움직이는 시공입니다. 동시 공사 한도가 크게 늘어납니다.","natm":"굴착한 면에 숏크리트를 뿜고 암반 스스로 버티게 하는 터널 공법입니다. 산악과 도심 지하 어디서나 터널 건설비를 낮춥니다.","ltun":"산을 돌아가지 않고 10km 넘게 곧장 뚫는 긴 터널입니다. 산악 노선을 곧게 펴 소요시간을 크게 줄입니다.","deep":"지하 40m 아래 깊은 곳에 놓는 터널입니다. 땅 위 건물과 상관없이 도심을 곧장 가로지르지만 역까지 내려가는 시간이 깁니다.","psc":"강선을 미리 당겨 둔 콘크리트로 만든 교량입니다. 중소 하천을 건너는 교량을 싸게 놓을 수 있습니다.","lbri":"경간이 긴 사장교 · 현수교 같은 큰 교량입니다. 큰 강과 바다의 만을 돌아가지 않고 곧장 건넙니다.","elev":"도로 위로 선로를 띄워 놓는 방식입니다. 건널목이 없어져 열차가 막히지 않고 사고도 줄지만 소음 민원이 생깁니다.","subw":"도심 땅속에 놓는 선로입니다. 용지 걱정 없이 도심 한가운데에 역을 둘 수 있지만 건설비가 많이 들고 공기가 깁니다.","ac":"교류 25,000V로 전기를 보내는 전철화 방식입니다. 변전소를 띄엄띄엄 두어도 되어 장거리 간선에 맞습니다.","dc":"직류 1,500V로 전기를 보내는 전철화 방식입니다. 차량이 싸고 지하 구간을 놓기 쉬워 도시 철도에 맞습니다.","tab":"역끼리 통표를 주고받아 한 구간에 열차 한 대만 들어가게 하는 가장 오래된 안전 방식입니다. 설비는 필요 없지만 열차 간격이 깁니다.","abs":"선로의 궤도회로가 열차를 감지해 신호를 저절로 바꾸는 방식입니다. 한 구간을 여러 칸으로 나눠 열차를 더 촘촘히 보냅니다.","ats":"기관사가 정지 신호를 지나치면 열차를 자동으로 세우는 장치입니다. 신호를 놓쳐 생기는 사고를 크게 줄입니다.","atc":"신호를 차내로 보내 정해진 속도를 넘으면 열차가 스스로 감속하는 장치입니다. 열차 간격을 좁히고 선로 용량을 늘립니다.","atp":"기존선에 고속열차가 직결할 때 속도를 감시하는 열차 보호 장치입니다. 기존선 구간에서도 고속열차가 더 빨리 달릴 수 있습니다.","ktcs":"무선 통신으로 열차 위치를 주고받아 앞 열차와의 거리를 실시간으로 맞추는 열차 제어입니다. 신호 구간 없이 열차 간격을 최소로 줄입니다.","ato":"정해진 운전 곡선대로 열차가 스스로 가속하고 정차 위치에 서는 자동 운전입니다. 정차 시간이 고르게 되고 운전 인건비가 줄어듭니다.","cbtc":"무선 통신 기반 열차 제어로 기관사 없이 운행하는 방식입니다. 열차 간격을 최소로 줄이지만 다른 노선과 직결하기 어렵습니다.","ctc":"한 관제실에서 여러 역의 신호와 선로 전환기를 원격으로 다루는 방식입니다. 역마다 사람을 두지 않아도 되고 지연을 빨리 되돌립니다.","kg":"대피선이 있는 역에서 급행이 완행을 앞지르게 하는 운행 방식입니다. 장거리 승객은 빨라지지만 완행 승객은 비켜 서는 동안 기다립니다.","unm":"승객이 적은 역에서 역무원 없이 승차권 발매기와 원격 안내로 운영하는 방식입니다.","tctr":"모든 노선의 열차를 한 관제센터에서 함께 보는 체계입니다. 한 곳의 지연이 다른 노선으로 번지는 것을 막습니다.","st1":"승강장 한두 면과 작은 대합실만 둔 가장 작은 역의 설계입니다. 싸게 지을 수 있어 첫 노선과 지선에 맞습니다.","st2":"매점과 도시락 가게를 둘 수 있는 보통 규모의 역 설계입니다.","st3":"승강장 네 면 이상과 상가를 둔 지역 거점역 설계입니다. 여러 노선이 만나는 도시의 중심역에 맞습니다.","st4":"열차가 들어와 되돌아 나가는 두단식 대형 승강장을 둔 종착역 설계입니다. 큰 도시의 관문역 규모입니다.","prv":"민간 자본으로 역사를 지어 백화점 · 상가를 함께 넣는 방식입니다. 임대 수익이 꾸준하지만 대합실 자리를 내줍니다.","plat1":"승강장을 늘려 더 긴 편성이 설 수 있게 하는 개량입니다.","plat2":"승강장 높이와 폭을 고쳐 2층 객차가 설 수 있게 하는 개량입니다.","tkt":"매표 창구를 전산망으로 묶어 좌석을 실시간으로 파는 방식입니다. 표를 사기 쉬워져 철도를 찾는 사람이 늘어납니다.","card":"교통카드 하나로 철도와 버스를 갈아탈 때 요금을 깎아 주는 연계입니다. 갈아타는 부담이 줄어 통근 승객이 늘어납니다."},"lanes":[["steam","v","증기"],["diesel","v","디젤"],["dmu","v","동차"],["elec","v","전기"], "plain":"수요 정상화","efx":[{"t":"demandMul","v":1.07}]},{"id":"decl22","cond":{"y":2022},"sec":"사회","lede":"전국 인구 정점 통과","title":"인구 감소 국면 진입","body":"전국 인구가 정점을 지났습니다. 늘어나는 수요로 적자를 덮을 수 없습니다. 유지할 망과 접을 망을 가르는 것이 남은 시대의 과제입니다."},{"id":"era_c1_open","kind":"era","cond":{"y":1960},"sec":"전망","title":"철도 사업 면허 발급 … 선로 한 줄 없이 출발","lede":"1챕터 · 창업과 첫 간선 · 1960~1975","paras":["새 철도 회사가 면허를 받았다. 가진 것은 출자금뿐이고 역도 선로도 아직 없다. 첫 15년 동안 어디에 먼저 선로를 놓느냐가 회사의 뼈대를 정한다.","업계는 서울과 부산을 잇는 경부축을 첫 간선으로 꼽는다. 사람과 물자가 가장 많이 오가는 축이라 수입이 빨리 들어오고, 이 시대 목표인 경부축 복선화와도 맞닿아 있다.","자본이 가장 귀한 시기다. 처음에는 단선과 간이역으로 길게 잇고, 열차가 붐비기 시작하는 구간부터 복선과 큰 역으로 올려 가는 방식이 무난하다는 평가다. 빚을 끌어 쓸 수는 있지만 시대가 끝날 때 부채비율이 목표 안에 있어야 한다."]},{"id":"era_5yr","kind":"era","cond":{"y":1962,"m":1},"sec":"시대","title":"제1차 경제개발 5개년계획 시작","lede":"정유·비료·시멘트 등 기간산업 육성 · 철도는 수송 동맥으로","paras":["정부가 1962년부터 다섯 해 동안의 경제개발계획을 내놓았다. 정유, 비료, 시멘트, 전력 같은 기간산업을 먼저 키우고 수출로 외화를 벌겠다는 구상이다.","공장이 들어서는 도시마다 원료와 제품, 일하러 오가는 사람이 늘어난다. 울산처럼 공업지구로 지정된 곳은 몇 해 안에 통행 수요가 크게 달라질 수 있다.","정부는 철도 투자를 이 계획에 넣는 방안도 검토하고 있다. 선로가 200km를 넘으면 정책 창의 결정 목록에 「경제개발계획 철도 투자 편입」이 열린다. 출자금을 받는 대신 정부가 지정한 산업선을 놓아야 한다."]},{"id":"era_urban","kind":"era","cond":{"y":1964,"m":5},"sec":"시대","title":"서울로, 서울로 … 농촌을 떠나는 사람들","lede":"도시 인구 급증 · 농촌 인구 유출","paras":["일자리를 찾아 농촌을 떠나 도시로 오는 사람이 해마다 늘고 있다. 서울에는 하루가 다르게 판잣집 동네가 생기고, 지방 군 지역에서는 젊은 층이 빠져나간다.","이 흐름은 1970년대 내내 이어질 것으로 보인다. 철도로 큰 도시와 잘 이어진 곳은 사람을 붙잡거나 끌어들이고, 연결이 늦은 군 지역은 인구가 더 빨리 준다.","도시 상세에서 전입과 전출을 볼 수 있다. 지금 역을 내는 곳이 20년 뒤의 수요 지도를 바꾼다."]},{"id":"era_c1_mid","kind":"era","cond":{"y":1967,"m":1},"sec":"전망","title":"도로의 시대가 온다 … 철도업계 \"남은 몇 해가 고비\"","lede":"1챕터 중반 · 고속도로 계획 잇따라","paras":["정부 안팎에서 고속도로를 놓자는 계획이 잇따라 나온다. 아직 착공 전이지만, 계획이 확정되면 몇 해 안에 서울과 지방을 잇는 도로가 생긴다.","도로가 열리면 100km 안팎의 짧은 축부터 승객이 버스와 화물차로 옮겨 간다. 지금 철도가 앞서 있는 경부축도 예외가 아니다.","업계에서는 도로가 열리기 전에 주요 구간을 복선으로 만들고 배차를 촘촘히 해 두어야 한다는 말이 나온다. 이 시대가 끝나는 1975년 무렵에는 도로와의 경쟁이 본격적으로 시작된다."]},{"id":"era_hwbus","kind":"era","cond":{"y":1968,"after":"hw_gyeongbu"},"sec":"시대","title":"고속버스 시대 개막","lede":"고속도로 따라 버스 노선 잇따라 개설","paras":["고속도로가 열리자 운수 회사들이 고속버스를 앞다투어 띄우고 있다. 터미널에서 바로 타고 내릴 수 있고 정해진 시각에 출발한다는 점이 승객을 끈다.","고속버스는 특히 200km 안쪽 도시 사이에서 강하다. 철도가 같은 축에서 승객을 지키려면 역까지 가는 시간을 감안해도 버스보다 빨라야 한다.","효용 분해 카드에서 도로의 실효속도가 해마다 어떻게 오르는지 볼 수 있다."]},{"id":"era_saemaul","kind":"era","cond":{"y":1971,"m":4},"sec":"시대","title":"새마을운동 전국으로","lede":"마을 길 넓히기 · 지붕 개량 · 농촌 소득 증대","paras":["1970년에 제창된 새마을운동이 전국 농촌으로 퍼지고 있다. 마을마다 길을 넓히고 다리를 놓으면서 버스가 들어가지 못하던 곳까지 길이 열린다.","농촌 사람들이 읍내와 도시로 나가기는 쉬워졌다. 다만 그 길을 먼저 차지하는 것은 시외버스다. 간이역 몇 개만 둔 지선은 이제 버스와 손님을 나눠야 한다."]},{"id":"era_oil1","kind":"era","cond":{"y":1973,"m":11},"sec":"시대","title":"중동 산유국 감산 … 석유값 네 배로","lede":"제1차 석유파동 · 연료비 급등","paras":["중동 전쟁을 계기로 산유국들이 석유 생산을 줄이고 값을 올렸다. 석유값이 몇 달 사이에 네 배 가까이 뛰면서 수입 연료에 기대는 산업 전체가 흔들린다.","디젤과 증기 기관차를 굴리는 철도도 연료비 부담을 피할 수 없다. 정부는 전기로 열차를 움직이는 전철화를 서두르라고 주문한다.","연구 창의 전철화 계통과 전기 견인 차종이 이 무렵부터 본격적인 검토 대상이 된다."]},{"id":"era_c1_end","kind":"era","cond":{"y":1974,"m":1},"sec":"전망","title":"창업 시대 마지막 해 … 다음은 도로와의 싸움","lede":"1챕터 마지막 해 · 1975년 1월 결산","paras":["올해가 회사를 세우고 첫 간선을 놓은 시대의 마지막 해다. 1975년 1월이 되면 경부축 복선화, 누적 수송, 부채비율 세 목표를 두고 결산이 이뤄진다.","다음 시대에는 돈보다 도로가 더 큰 적이다. 고속도로가 늘어나면 단거리 축의 분담률이 먼저 무너지고, 수도권에서는 전철 통근 수요가 새로 커진다.","남은 한 해 동안 우 패널에서 목표 진행률을 확인하고, 다음 시대에 쓸 복선과 전철화 투자 여력을 남겨 두는 것이 좋다."]},{"id":"era_c2_open","kind":"era","cond":{"y":1975},"sec":"전망","title":"도로가 주적이 된 시대","lede":"2챕터 · 전철화와 도로 방어 · 1975~1990","paras":["전국에 고속도로망이 퍼지면서 철도는 처음으로 승객을 잃는 쪽에 섰다. 이 시대의 숙제는 도로에 빼앗기는 단거리 승객을 지키고, 커지는 수도권 통근 수요를 철도로 담는 일이다.","목표는 수도권 광역 분담률, 지방 소도시 연결, 분기 흑자 전환 셋이다. 수도권에 돈을 몰면 지방 연결이 처지고, 지방까지 넓히면 흑자가 멀어진다.","전철화와 전동차는 정차가 잦은 통근 구간에서 힘을 쓰고, 신호 등급을 올리면 같은 선로에 더 많은 열차를 넣을 수 있다."]},{"id":"era_mideast","kind":"era","cond":{"y":1977,"m":6},"sec":"시대","title":"중동 건설 붐 … 외화 벌이 나선 기술자들","lede":"해외 건설 수주 급증 · 국내 경기 활기","paras":["석유값이 오른 중동 산유국들이 도로와 항만, 주택을 짓는 공사를 쏟아내면서 한국 건설사들이 대거 진출했다. 현장으로 떠나는 기술자와 노동자가 수만 명에 이른다.","벌어들인 외화가 국내로 들어오며 경기가 달아올랐다. 업무 출장과 인력의 이동이 늘고, 건설 자재값과 인건비도 함께 오른다.","철도로서는 손님이 느는 좋은 시기지만 공사비도 오르는 때다. 미뤄 둔 복선화와 역 확장을 언제 할지 따져 볼 만하다."]},{"id":"era_oil2","kind":"era","cond":{"y":1980,"m":3},"sec":"시대","title":"석유값 또 급등 … 성장 멈춘 경제","lede":"제2차 석유파동 · 물가 급등과 마이너스 성장 우려","paras":["1979년 이란 혁명 이후 석유값이 다시 크게 오르면서 경제가 얼어붙었다. 물가는 치솟고 생산은 줄어, 올해 경제가 뒷걸음질 칠 것이라는 전망이 우세하다.","철도 업계는 연료비와 금리 부담을 걱정하고 있다. 확장을 서두르기보다 현금 흐름부터 점검하자는 목소리가 크다."]},{"id":"era_curfew","kind":"era","cond":{"y":1982,"m":1},"sec":"시대","title":"야간 통행금지 36년 만에 해제","lede":"자정 이후에도 다닐 수 있게 · 심야 이동 늘 듯","paras":["1945년부터 이어져 온 야간 통행금지가 1월 5일 0시를 기해 풀렸다. 자정부터 새벽 네 시까지 거리에 나설 수 없던 제한이 사라졌다.","밤늦게 귀가하는 직장인과 새벽에 장을 보러 나서는 상인이 늘 것으로 보인다. 막차와 첫차 시각을 두고 철도 쪽의 셈법도 달라진다."]},{"id":"era_c2_mid","kind":"era","cond":{"y":1982,"m":7},"sec":"전망","title":"도로 방어전 반환점","lede":"2챕터 중반 · 수도권 통근과 지방 연결","paras":["고속도로 개통이 이어지며 단거리 축의 분담률이 눈에 띄게 줄었다. 한편 수도권에서는 위성도시가 커지면서 서울로 출퇴근하는 사람이 해마다 늘고 있다.","수도권 광역 분담률은 배차와 혼잡을 손보면 오르고, 지방 소도시 연결은 역만이 아니라 열차가 실제로 다녀야 오른다. 분기 흑자는 두 목표에 돈을 쓰고도 남겨야 하는 숙제다.","1990년이 되면 다음 시대로 넘어간다. 그때는 고속선 건설에 지금까지의 투자 총액보다 큰 돈이 들어간다."]},{"id":"era_car1m","kind":"era","cond":{"y":1985,"m":5},"sec":"시대","title":"자동차 100만 대 돌파","lede":"마이카 시대 성큼 · 주말 나들이도 차로","paras":["전국의 자동차 등록 대수가 100만 대를 넘어섰다. 승용차를 사는 가정이 빠르게 늘면서 주말이면 교외로 나가는 길이 막힌다.","자가용이 생긴 가정은 가까운 거리부터 철도를 덜 탄다. 반대로 도심의 길이 막힐수록 정시에 다니는 전철의 장점은 커진다."]},{"id":"era_3low","kind":"era","cond":{"y":1986,"m":6},"sec":"시대","title":"저유가·저금리·저달러 … 3저 호황","lede":"수출 급증 · 첫 경상수지 흑자 기대","paras":["석유값과 국제 금리, 달러값이 한꺼번에 내리면서 수출이 크게 늘고 있다. 경상수지가 처음으로 흑자를 낼 것이라는 관측이 나온다.","공장과 사무실이 바빠지면서 출장과 통근이 늘고, 정부 재정에도 숨통이 트였다. 금리가 낮은 지금이 대출로 설비를 늘리기 좋은 때라는 말이 업계에 돈다."]},{"id":"era_newtown","kind":"era","cond":{"y":1989,"m":4},"sec":"시대","title":"분당·일산 신도시 건설 발표","lede":"주택 200만 호 건설 계획의 핵심 사업","paras":["정부가 서울 남쪽 분당과 서북쪽 일산에 대규모 신도시를 짓기로 했다. 집값을 잡기 위한 주택 200만 호 건설 계획의 핵심 사업이다.","입주가 시작되는 1990년대 초부터 서울로 출퇴근하는 인구가 크게 늘어난다. 신도시와 서울 도심을 잇는 광역 전철을 누가 먼저 놓느냐에 수도권 통근 수요가 걸려 있다."]},{"id":"era_c2_end","kind":"era","cond":{"y":1989,"m":1},"sec":"전망","title":"도로 방어 시대 마지막 해","lede":"2챕터 마지막 해 · 다음은 고속철 건설","paras":["올해가 고속도로와 맞서 온 시대의 마지막 해다. 1990년 1월에 수도권 광역 분담률, 지방 소도시 연결, 분기 흑자 세 목표로 결산이 이뤄진다.","다음 시대의 주제는 고속철도다. 고속선은 일반선보다 몇 배 비싸고, 장거리에서는 항공과 직접 겨뤄야 한다. 정책 창에서 「고속철도 기본계획」 결정을 내릴 수 있는 시기도 이 무렵부터다."]},{"id":"era_c3_open","kind":"era","cond":{"y":1990},"sec":"전망","title":"고속철도의 시대가 열린다","lede":"3챕터 · 고속철 건설 · 1990~2005","paras":["경제 규모가 커지고 장거리 이동이 늘면서, 서울과 부산을 두 시간대로 잇는 고속철도가 국가 사업으로 떠올랐다. 이 시대의 고속선 건설비는 회사가 지금까지 쓴 돈을 모두 합친 것보다 크다.","목표는 고속선 개통, 300km 넘는 장거리 분담률, 부채 관리다. 고속선을 빨리 깔수록 장거리 승객을 항공에서 되찾지만 빚이 불어난다.","고속선을 놓으려면 연구 창의 고속선 설계기준과 고속열차 연구가 먼저 끝나야 한다. 연구 기간을 감안해 공사 계획을 세우는 것이 좋다."]},{"id":"era_newtown_in","kind":"era","cond":{"y":1992,"m":9},"sec":"시대","title":"신도시 입주 본격화 … 출근길 전쟁","lede":"분당·일산 입주 · 광역 교통 수요 급증","paras":["분당과 일산 신도시에 입주가 이어지면서 수십만 명이 새로 서울 외곽에 자리 잡았다. 아침마다 서울로 들어가는 길과 버스는 이미 포화 상태다.","광역 전철이 닿은 신도시와 그렇지 않은 신도시 사이에 출퇴근 시간 차이가 크게 벌어지고 있다. 수도권 통근 노선의 혼잡과 배차가 다시 경영의 중심으로 돌아왔다."]},{"id":"era_local","kind":"era","cond":{"y":1995,"m":7},"sec":"시대","title":"지방자치 시대 개막","lede":"단체장·지방의원 동시 선거 · 지역 요구 커진다","paras":["6월 27일 광역·기초 단체장과 지방의원을 한꺼번에 뽑는 선거가 치러졌다. 지방자치가 전면적으로 시작되면서 지자체가 자기 지역의 교통 문제를 직접 들고 나서고 있다.","역을 내 달라, 열차를 늘려 달라는 지역의 요구가 한층 거세질 것으로 보인다. 지자체가 맡기는 의뢰는 지역 신뢰를 쌓는 길이지만, 모두 받다 보면 적자 노선이 함께 는다."]},{"id":"era_c3_mid","kind":"era","cond":{"y":1996,"m":1},"sec":"전망","title":"고속선 공사 한창 … 빚과의 경주","lede":"3챕터 중반 · 부채와 장거리 분담률","paras":["고속선 공사비가 쌓이면서 업계 전반의 부채가 빠르게 늘고 있다. 장거리 승객을 되찾는 효과는 고속선이 이어진 구간부터 차례로 나타난다.","부채 목표는 시대가 끝나는 2005년 1월에 판정된다. 공사를 서두르되, 그 전에 빚을 줄일 수입원과 상환 계획을 함께 세워 두어야 한다.","경기는 좋지만 단기 외채가 많다는 경고도 나온다. 큰 사업일수록 자금 계획에 여유를 두라는 조언이 많다."]},{"id":"era_car10m","kind":"era","cond":{"y":1997,"m":7},"sec":"시대","title":"자동차 1천만 대 시대","lede":"주말·명절 고속도로 정체 일상화","paras":["전국의 자동차 등록 대수가 1천만 대를 넘었다. 100만 대를 넘긴 지 12년 만이다.","차가 늘면서 명절과 주말의 고속도로 정체가 일상이 됐다. 도로가 막히는 축에서는 정시성을 앞세운 철도가 다시 승객을 끌어올 기회가 생긴다."]},{"id":"era_cup02","kind":"era","cond":{"y":2002,"m":6},"sec":"시대","title":"한일 월드컵 개최","lede":"국내 10개 도시에서 경기 · 경기장마다 인파","paras":["한국과 일본이 함께 여는 월드컵이 개막했다. 국내 10개 도시에서 경기가 열리면서 경기장이 있는 도시마다 관중과 응원 인파가 몰리고 있다.","행사 수송은 한때다. 대회가 끝나면 대부분 원래 수요로 돌아오므로, 임시 증편과 영구 증설을 나눠서 판단할 필요가 있다."]},{"id":"era_5day","kind":"era","cond":{"y":2004,"m":7},"sec":"시대","title":"주5일 근무제 시행","lede":"공공기관·대기업부터 · 주말 여가 통행 늘 듯","paras":["7월부터 공공기관과 1천 명 이상 사업장에서 주5일 근무제가 시행된다. 몇 해에 걸쳐 작은 사업장까지 넓혀 갈 예정이다.","토요일이 쉬는 날이 되면 금요일 저녁과 일요일 오후에 장거리 이동이 몰린다. 관광지로 가는 노선과 주말 열차 편성을 다시 볼 때다."]},{"id":"era_c3_end","kind":"era","cond":{"y":2004,"m":1},"sec":"전망","title":"고속철 건설 시대 마지막 해","lede":"3챕터 마지막 해 · 다음은 축소의 시대","paras":["올해가 고속선을 놓아 온 시대의 마지막 해다. 2005년 1월에 고속선 개통, 장거리 분담률, 부채 세 목표로 결산이 이뤄진다.","다음 시대에는 성장이 멈춘다. 출생아가 줄고 지방 인구가 빠르게 빠지면서, 늘어나는 수요로 적자를 덮던 방식이 통하지 않게 된다. 고속망을 마저 잇는 한편, 손님이 줄어드는 지선을 어떻게 할지가 숙제가 된다."]},{"id":"era_c4_open","kind":"era","cond":{"y":2005},"sec":"전망","title":"고속망 완성과 축소 균형의 시대","lede":"4챕터 · 2005~2030","paras":["고속열차가 달리기 시작했고 전국 고속망을 마저 잇는 일이 남았다. 동시에 인구 증가가 멈춰 가면서 수요가 저절로 늘어나던 시대는 끝나 간다.","목표는 전국 소도시 연결, 누적 수송, 분기 흑자 유지다. 소도시 노선은 대부분 적자라 연결을 지키는 만큼 흑자가 어려워진다.","이 시대는 25년으로 앞선 시대보다 길다. 유지비가 해마다 쌓이므로 선로와 역을 새로 늘릴 때마다 그 유지비를 언제까지 감당할지 따져야 한다."]},{"id":"era_lowbirth","kind":"era","cond":{"y":2006,"m":8},"sec":"시대","title":"합계출산율 1.1명 밑으로","lede":"세계 최저 수준 · 저출산 대책 본격 논의","paras":["지난해 합계출산율이 1.1명 아래로 떨어져 세계에서 가장 낮은 수준이 됐다. 정부는 저출산·고령사회 기본계획을 세우고 대책 마련에 나섰다.","당장 승객이 줄지는 않지만 20년 뒤 통학과 통근 인구가 얇아진다는 뜻이다. 지금 놓는 선로는 그 시대까지 유지비를 내야 한다."]},{"id":"era_smart","kind":"era","cond":{"y":2010,"m":6},"sec":"시대","title":"손안의 열차 시간표","lede":"스마트폰 확산 · 모바일 예매와 실시간 정보","paras":["스마트폰이 빠르게 퍼지면서 승객이 열차 시각과 좌석을 휴대전화로 확인하고 예매하는 일이 흔해졌다. 버스와 열차, 항공의 시간과 요금을 한눈에 비교하는 것도 쉬워졌다.","정보가 투명해질수록 승객은 더 빠르고 싼 수단으로 쉽게 옮겨 간다. 배차 간격과 소요시간의 작은 차이가 분담률에 더 크게 드러나는 시대다."]},{"id":"era_sejong","kind":"era","cond":{"y":2012,"m":7},"sec":"시대","title":"세종특별자치시 출범","lede":"중앙부처 이전 시작 · 혁신도시로 공공기관 이전","paras":["7월 1일 세종특별자치시가 출범했다. 올해부터 중앙행정기관이 차례로 옮겨 오고, 전국 혁신도시로 공공기관 이전도 이어진다.","서울과 세종, 세종과 지방 혁신도시를 오가는 업무 출장이 새로 생긴다. 공무원과 공공기관 직원의 주말 귀가 수요도 적지 않다."]},{"id":"era_c4_mid","kind":"era","cond":{"y":2017,"m":1},"sec":"전망","title":"축소 균형 시대 반환점","lede":"4챕터 중반 · 인구 정점 임박","paras":["전국 인구가 몇 해 안에 정점을 찍을 것이라는 전망이 우세하다. 이미 군 지역과 산간 도시에서는 승객이 해마다 줄고 있다.","폐역 권고가 붙는 역이 늘어날 것이다. 접는 역과 지키는 역을 가르는 기준을 미리 세워 두면, 소도시 연결 목표와 흑자 목표를 함께 지키기가 쉬워진다.","2030년 결산까지 13년이 남았다."]},{"id":"era_covid","kind":"era","cond":{"y":2020,"m":2},"sec":"시대","title":"감염병 대유행 … 텅 빈 열차","lede":"코로나19 확산 · 이동 자제와 재택근무 · 2년간 수요 감소","efx":[{"t":"demandMul","v":0.85,"dur":24}],"paras":["코로나19가 전국으로 번지면서 정부가 이동 자제와 사회적 거리두기를 당부했다. 회사는 재택근무를 늘리고 학교는 개학을 미뤘다.","열차 이용객이 크게 줄었다. 경기 침체와 달리 감염 확산이 잦아들면 돌아올 수요로 보이지만, 그사이 운임 수입이 비는 동안 유지비는 그대로 나간다."]},{"id":"era_carbon","kind":"era","cond":{"y":2020,"m":11},"sec":"시대","title":"2050 탄소중립 선언","lede":"수송 부문 온실가스 감축 · 철도 역할 커진다","paras":["정부가 2050년까지 온실가스 순배출을 0으로 만들겠다고 선언했다. 수송 부문에서는 자동차와 항공 대신 철도로 옮겨 타게 하는 방안이 핵심 과제로 꼽힌다.","정책 창의 「탄소중립 교통 전환」 결정은 친환경 차량 연구(VVVF 제어, 회생제동)를 마쳐야 내릴 수 있다. 연구가 늦었다면 지금부터 연구소 칸을 그쪽에 돌릴 만하다."]},{"id":"era_superaged","kind":"era","cond":{"y":2025,"m":1},"sec":"시대","title":"초고령사회 진입","lede":"65세 이상 인구 20% 넘어 · 고령사회 7년 만","paras":["65세 이상 인구가 전체의 20%를 넘어 초고령사회에 들어섰다. 고령사회가 된 지 7년 만이다.","통근 승객은 줄어도 병원과 시장을 오가는 고령층의 낮 시간 이동은 꾸준하다. 계단 오르내림이 적은 역과 촘촘한 낮 배차가 필요한 노선이 늘어난다."]},{"id":"era_c4_end","kind":"era","cond":{"y":2029,"m":1},"sec":"전망","title":"마지막 결산의 해","lede":"4챕터 마지막 해 · 2030년 1월 최종 결과","paras":["올해가 한국 철도 70년을 다루는 이 시나리오의 마지막 해다. 2030년 1월에 소도시 연결, 누적 수송, 분기 흑자 세 목표로 이 시대를 결산하고, 지나온 챕터의 성적을 모은 최종 결과가 나온다.","남은 열두 달은 큰 공사를 새로 벌이기보다 지금 망을 고르게 굴리는 편이 결산에 유리하다. 적자 지선을 한꺼번에 접으면 흑자는 지켜도 소도시 연결이 무너진다."]}],"quests":[{"id":"q_econ_ind","src":"gov","who":"경제기획원 · 교통부","mand":2,"tpl":"econ","cond":{"dec":"econPlan"},"due":{"rel":60},"title":"{A} 산업선 부설 지시","body":"경제개발계획에 따라 {A}의 {I} 물동량을 실어 낼 산업선을 가까운 {B}역에서 놓으라는 지시다. 출자금을 받은 대가라 거절할 수 없다.","win":[{"t":"cash","r":0.3},{"t":"trust","id":"gov","v":5}],"lose":[{"t":"trust","id":"gov","v":-20}],"claw":0.5},{"id":"q_hsr2","src 열차입니다. 짧게 묶어 자주 다니기 좋아 지선과 통근 구간에 맞습니다.","dhc":"유체 변속기를 쓴 디젤동차로, 가속이 좋고 객실이 조용해 우등 열차에 맞습니다.","ecoVeh":"배터리나 수소 연료전지로 달리는 동차입니다. 전철화가 어려운 지선에서 전기차에 가까운 성능을 냅니다.","eloco":"가공선의 전기로 달리는 기관차입니다. 전철화한 구간에서만 다니지만 험한 산악 구간에서 디젤보다 힘이 좋습니다.","elh":"출력을 높인 전기기관차와 그에 맞춘 변전 설비입니다. 장대 화물과 고속 여객을 같은 선로에서 소화합니다.","emu":"객차마다 전동기를 단 전기 열차입니다. 가속과 감속이 빨라 역이 촘촘한 도시 통근 노선에 맞습니다.","acdc":"교류 구간과 직류 구간을 모두 달릴 수 있는 전동차입니다. 전철 방식이 다른 두 노선을 한 노선으로 이어 달릴 때 필요합니다.","vvvf":"인버터로 전동기의 전압과 주파수를 함께 조절하는 제어 방식입니다. 전기를 덜 쓰고 정비가 쉬워 전동차의 표준이 되어 갑니다.","regen":"제동할 때 전동기를 발전기로 돌려 만든 전기를 가선으로 되돌려 다른 열차가 쓰게 하는 기술입니다.","dd":"위아래 두 층에 좌석을 둔 객차입니다. 같은 길이의 승강장에 더 많은 승객을 태우지만 타고 내리는 데 시간이 더 걸립니다.","hsc":"앞뒤 동력차가 가운데 객차를 끄는 고속열차입니다. 고속철도를 처음 놓을 때 흔히 이미 쓰이는 해외 기술을 들여옵니다.","hsk":"고속철도 기술을 국내에서 개발해 만든 고속열차입니다. 수입 차량보다 싸고 환율 변동에 흔들리지 않습니다.","tilt":"곡선에서 차체를 안쪽으로 기울여 속도를 줄이지 않고 지나가는 열차입니다. 고속선을 새로 놓지 않고 기존선을 빠르게 만드는 방법입니다.","hsd":"객차마다 동력을 나눠 단 고속열차입니다. 가속이 빠르고 좌석이 많아 역이 많은 노선에서도 손해가 적습니다.","conc":"나무 대신 콘크리트로 만든 침목입니다. 썩지 않고 무거워 선로가 덜 틀어지므로 유지보수가 줄어듭니다.","cwr":"레일 이음매를 용접해 수백 m를 한 줄로 이은 레일입니다. 덜컹거림이 사라져 승차감이 좋아지고 선로 정비도 줄어듭니다.","hsl":"시속 300km로 달릴 수 있게 곡선을 완만하게 하고 기울기를 낮춘 선로 기준입니다. 터널과 교량이 많아져 건설비가 가장 비쌉니다.","mech":"굴삭기 · 궤도부설기 같은 장비로 선로를 놓는 방식입니다. 사람 손에 의존하던 공사보다 한꺼번에 더 많은 구간을 공사할 수 있습니다.","prefab":"교량이나 터널의 마디를 공장에서 미리 만들어 현장에서 잇는 공법입니다. 공사 현장이 단순해져 동시에 맡을 수 있는 공사가 늘어납니다.","smartc":"설계를 3차원 정보 모델(BIM)로 관리하고 장비를 자동으로 움직이는 시공입니다. 동시 공사 한도가 크게 늘어납니다.","natm":"굴착한 면에 숏크리트를 뿜고 암반 스스로 버티게 하는 터널 공법입니다. 산악과 도심 지하 어디서나 터널 건설비를 낮춥니다.","ltun":"산을 돌아가지 않고 10km 넘게 곧장 뚫는 긴 터널입니다. 산악 노선을 곧게 펴 소요시간을 크게 줄입니다.","deep":"지하 40m 아래 깊은 곳에 놓는 터널입니다. 땅 위 건물과 상관없이 도심을 곧장 가로지르지만 역까지 내려가는 시간이 깁니다.","psc":"강선을 미리 당겨 둔 콘크리트로 만든 교량입니다. 중소 하천을 건너는 교량을 싸게 놓을 수 있습니다.","lbri":"경간이 긴 사장교 · 현수교 같은 큰 교량입니다. 큰 강과 바다의 만을 돌아가지 않고 곧장 건넙니다.","elev":"도로 위로 선로를 띄워 놓는 방식입니다. 건널목이 없어져 열차가 막히지 않고 사고도 줄지만 소음 민원이 생깁니다.","subw":"도심 땅속에 놓는 선로입니다. 용지 걱정 없이 도심 한가운데에 역을 둘 수 있지만 건설비가 많이 들고 공기가 깁니다.","ac":"교류 25,000V로 전기를 보내는 전철화 방식입니다. 변전소를 띄엄띄엄 두어도 되어 장거리 간선에 맞습니다.","dc":"직류 1,500V로 전기를 보내는 전철화 방식입니다. 차량이 싸고 지하 구간을 놓기 쉬워 도시 철도에 맞습니다.","tab":"역끼리 통표를 주고받아 한 구간에 열차 한 대만 들어가게 하는 가장 오래된 안전 방식입니다. 설비는 필요 없지만 열차 간격이 깁니다.","abs":"선로의 궤도회로가 열차를 감지해 신호를 저절로 바꾸는 방식입니다. 한 구간을 여러 칸으로 나눠 열차를 더 촘촘히 보냅니다.","ats":"기관사가 정지 신호를 지나치면 열차를 자동으로 세우는 장치입니다. 신호를 놓쳐 생기는 사고를 크게 줄입니다.","atc":"신호를 차내로 보내 정해진 속도를 넘으면 열차가 스스로 감속하는 장치입니다. 열차 간격을 좁히고 선로 용량을 늘립니다.","atp":"기존선에 고속열차가 직결할 때 속도를 감시하는 열차 보호 장치입니다. 기존선 구간에서도 고속열차가 더 빨리 달릴 수 있습니다.","ktcs":"무선 통신으로 열차 위치를 주고받아 앞 열차와의 거리를 실시간으로 맞추는 열차 제어입니다. 신호 구간 없이 열차 간격을 최소로 줄입니다.","ato":"정해진 운전 곡선대로 열차가 스스로 가속하고 정차 위치에 서는 자동 운전입니다. 정차 시간이 고르게 되고 운전 인건비가 줄어듭니다.","cbtc":"무선 통신 기반 열차 제어로 기관사 없이 운행하는 방식입니다. 열차 간격을 최소로 줄이지만 다른 노선과 직결하기 어렵습니다.","ctc":"한 관제실에서 여러 역의 신호와 선로 전환기를 원격으로 다루는 방식입니다. 역마다 사람을 두지 않아도 되고 지연을 빨리 되돌립니다.","kg":"대피선이 있는 역에서 급행이 완행을 앞지르게 하는 운행 방식입니다. 장거리 승객은 빨라지지만 완행 승객은 비켜 서는 동안 기다립니다.","unm":"승객이 적은 역에서 역무원 없이 승차권 발매기와 원격 안내로 운영하는 방식입니다.","tctr":"모든 노선의 열차를 한 관제센터에서 함께 보는 체계입니다. 한 곳의 지연이 다른 노선으로 번지는 것을 막습니다.","st1":"승강장 한두 면과 작은 대합실만 둔 가장 작은 역의 설계입니다. 싸게 지을 수 있어 첫 노선과 지선에 맞습니다.","st2":"매점과 도시락 가게를 둘 수 있는 보통 규모의 역 설계입니다.","st3":"승강장 네 면 이상과 상가를 둔 지역 거점역 설계입니다. 여러 노선이 만나는 도시의 중심역에 맞습니다.","st4":"열차가 들어와 되돌아 나가는 두단식 대형 승강장을 둔 종착역 설계입니다. 큰 도시의 관문역 규모입니다.","prv":"민간 자본으로 역사를 지어 백화점 · 상가를 함께 넣는 방식입니다. 임대 수익이 꾸준하지만 대합실 자리를 내줍니다.","plat1":"승강장을 늘려 더 긴 편성이 설 수 있게 하는 개량입니다.","plat2":"승강장 높이와 폭을 고쳐 2층 객차가 설 수 있게 하는 개량입니다.","tkt":"매표 창구를 전산망으로 묶어 좌석을 실시간으로 파는 방식입니다. 표를 사기 쉬워져 철도를 찾는 사람이 늘어납니다.","card":"교통카드 하나로 철도와 버스를 갈아탈 때 요금을 깎아 주는 연계입니다. 갈아타는 부담이 줄어 통근 승객이 늘어납니다."},"lanes":[["steam","v","증기"],["diesel","v","디젤"],["dmu","v","동차"],["elec","v","전기"],["emu","v","전동차"],["hs","v","고속"],["track","c","궤도"],["cons","c","시공"],["tun","c","터널"],["bri","c","교량"],["urb","c","도시"],["acl","c","교류"],["dcl","c","직류"],["blk","s","폐색"],["urbs","s","도시형"],["ops","s","관제·운영"],["sta","m","역사"],["fac","m","설비"],["sale","m","판매"]],"eras":[["무연화 정책",1960,1975,0,0],["지하철 3·4호선",1980,1990,0,0],["경부고속철",1992,2004,0,0],["GTX",2018,203   const im=new Image();im.onload=()=>res(maskFromImage(im,im.naturalWidth,im.naturalHeight,true));
  im.onerror=()=>{toast('지도 이미지를 읽지 못해 빈 바다로 엽니다');const W=Math.round(mw/2),H=Math.round(mh/2);res({W,H,mask:new Uint8Array(W*H)});};

// 이미지 → 칸 마스크. exact면 그림 한 픽셀이 한 칸이고 팔레트에 가장 가까운 색을 고른다.
function maskFromImage(im,W,H,exact){
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 g.imageSmoothingEnabled=!exact;g.drawImage(im,0,0,W,H);
 const d=g.getImageData(0,0,W,H).data,mask=new Uint8Array(W*H);
 for(let k=0;k<W*H;k++){const i=k*4,r=d[i],gg=d[i+1],b=d[i+2],a=d[i+3];
  if(exact){if(a<8){mask[k]=0;continue;}let best=0,bd=1e9;
   MAT.forEach(M=>{const dd=(M.rgb[0]-r)**2+(M.rgb[1]-gg)**2+(M.rgb[2]-b)**2;if(dd<bd){bd=dd;best=M.id;}});mask[k]=best;}
  else{const lum=r*.3+gg*.59+b*.11;   // 참고 이미지 자동 분류 · 게임의 바다 판정과 같은 규칙
   mask[k]=(a<8||(b>r+18&&lum>110))?0:1;}}

}

function buildScenario(){

 o.id=E.meta.id.trim();o.ver=E.meta.ver.trim();o.title=E.meta.title.trim();o.tag=E.meta.tag;o.desc=E.meta.desc;
 if(E.meta.hidden)o.hidden=true;else delete o.hidden;
 const map=Object.assign({},o.map||{},{src:maskPNG(),w:r2(E.mw),h:r2(E.mh),F0:E.F0,kmpp:r6(E.kmpp),proj:E.proj.map(r6),

 o.map=map;

 o.bal=Object.assign({},o.bal||{},E.bal);

 // 정책 권역 · pv는 지역 코드 묶음이다
 if(o.policy)o.policy.regs=clone(E.pregs);
 // 챕터와 프리셋. 첫 챕터는 프리셋이 없다(15-28). 다른 챕터는 자기 프리셋을 가리킨다

 o.chapters=E.chapters.map((c,i)=>{const C=clone(c);
  if(i===0){C.pre=null;return C;}
  let k=presetKey(i);while(used.has(k))k+='b';used.add(k);C.pre=k;
  const P=E.presets[c.pre]||E.presets[k]||{};
  pres[k]={gr:P.gr==null?1:P.gr,st:(P.st||[]).slice(),g0:(P.g0||[]).slice(),unl:(P.unl||[]).slice(),tk:clone(P.tk||[]),ln:clone(P.ln||[])};
  Object.keys(P).forEach(x=>{if(!(x in pres[k]))pres[k][x]=clone(P[x]);});
  ['g0','unl'].forEach(x=>{if(!pres[k][x].length)delete pres[k][x];});   // 빈 선택 필드는 내보내지 않는다

 if(E.nodes.length&&E.nodes[0].a&&E.nodes[0].a.parent)warn.push('첫 노드(수도)가 서브역입니다. 수도는 수요 노드여야 합니다');

 E.chapters.forEach((c,i)=>{

   if(g.m==='dblRatio'&&E.axis.length<2)warn.push((i+1)+'챕터 목표 「'+g.nm+'」가 주축을 쓰는데 주축 도시가 둘 미만입니다(게임은 한국 경부축으로 대신 셉니다)');
   if(M&&M[4])warn.push((i+1)+'챕터 목표 「'+g.nm+'」의 지표는 한국 도시 이름에 묶여 있습니다');
   if(g.m==='connSmall'&&!E.nodes.some(n=>n.a&&n.a.small))warn.push((i+1)+'챕터 목표 「'+g.nm+'」: 「소도시」로 표시한 노드가 없어 인구 가중이 작은 노드를 대신 셉니다');});
  if(i>0&&E.chapters[i-1].y1!==c.y0)warn.push((i+1)+'챕터 시작 연도가 앞 챕터 끝 연도와 다릅니다');
  if(c.y1<=c.y0)err.push((i+1)+'챕터의 끝 연도가 시작 연도보다 늦어야 합니다');
  if(i>0){const P=E.presets[c.pre]||{};
   (P.st||[]).forEach(nm=>{if(!names.has(nm))err.push((i+1)+'챕터 프리셋의 역이 없는 노드입니다 · '+nm);});
   (P.tk||[]).forEach(t=>{if(!names.has(t[0])||!names.has(t[1]))err.push((i+1)+'챕터 프리셋 선로가 없는 노드를 잇습니다 · '+t[0]+'–'+t[1]);});
   const tks=new Set((P.tk||[]).map(t=>tkKey(t[0],t[1])));const sts=new Set(P.st||[]);
   (P.ln||[]).forEach(L=>{if(!L[2]||L[2].length<2)warn.push((i+1)+'챕터 프리셋 노선 「'+L[0]+'」의 정차역이 둘 미만입니다');
    for(let q=1;q<(L[2]||[]).length;q++)if(!tks.has(tkKey(L[2][q-1],L[2][q]))){warn.push((i+1)+'챕터 노선 「'+L[0]+'」: '+L[2][q-1]+'–'+L[2][q]+' 사이에 선로가 없습니다');break;}

 return{err,warn,S};
}

/* ------------------------------------------------------------------ 지도 조작 */
function paintAt(x,y,m){const g=E.grid,c=cs(),ch=E.mh/g.H,cx=Math.floor(x/c),cy=Math.floor(y/ch);let ch2=false;
 for(let j=cy-brush+1;j<=cy+brush-1;j++)for(let i=cx-brush+1;i<=cx+brush-1;i++){if(i<0||j<0||i>=g.W||j>=g.H)continue;const k=j*g.W+i;if(g.mask[k]!==m){g.mask[k]=m;ch2=true;}}
 if(ch2){mcache&&(mcache.dirty=true);draw();}}
function paintLine(a,b,m){const c=cs(),d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/(c*.5)));
 for(let s=0;s<=n;s++)paintAt(a[0]+(b[0]-a[0])*s/n,a[1]+(b[1]-a[1])*s/n,m);}
function fillAt(x,y,m){const g=E.grid,cx=Math.floor(x/cs()),cy=Math.floor(y/(E.mh/g.H));if(cx<0||cy<0||cx>=g.W||cy>=g.H)return;
 const k0=cy*g.W+cx,from=g.mask[k0];if(from===m)return;push();const st=[k0];g.mask[k0]=m;
 while(st.length){const k=st.pop(),i=k%g.W,j=(k/g.W)|0;
  [[i-1,j],[i+1,j],[i,j-1],[i,j+1]].forEach(([a,b])=>{if(a<0||b<0||a>=g.W||b>=g.H)return;const q=b*g.W+a;if(g.mask[q]===from){g.mask[q]=m;st.push(q);}});}
 mcache&&(mcache.dirty=true);draw();}
function nodeAt(X,Y){let best=-1,bd=1e9;E.nodes.forEach((n,i)=>{const [x,y]=M2S(n.x,n.y);const d=Math.hypot(x-X,y-Y);if(d<Math.max(10,nodeR(n)+5)&&d<bd){bd=d;best=i;}});return best;}
function peakAt(x,y){return E.peaks.findIndex(p=>Math.abs(p[0]-x)<11&&Math.abs(p[1]-y)<10);}
function tkAt(X,Y){const P=curPreset();if(!P)return -1;const idx={};E.nodes.forEach((n,i)=>idx[n.n]=i);let best=-1,bd=8;
 P.tk.forEach((t,ti)=>{const a=E.nodes[idx[t[0]]],b=E.nodes[idx[t[1]]];if(!a||!b)return;const A=M2S(a.x,a.y),B=M2S(b.x,b.y);
  const dx=B[0]-A[0],dy=B[1]-A[1],L=dx*dx+dy*dy||1;let u=((X-A[0])*dx+(Y-A[1])*dy)/L;u=Math.max(0,Math.min(1,u));
  const d=Math.hypot(A[0]+u*dx-X,A[1]+u*dy-Y);if(d<bd){bd=d;best=ti;}});return best;}
function uniqName(base){let n=base,k=2;const s=new Set(E.nodes.map(x=>x.n));while(s.has(n))n=base+' '+(k++);return n;}
function renameNode(i,nm){const old=E.nodes[i].n;nm=nm.trim();if(!nm||nm===old)return false;
 if(E.nodes.some((n,j)=>j!==i&&n.n===nm)){toast('같은 이름의 노드가 이미 있습니다');return false;}
 push();E.nodes[i].n=nm;const R=x=>x===old?nm:x;
 E.nodes.forEach(n=>{const a=n.a||{};if(a.parent===old)a.parent=nm;if(a.only===old)a.only=nm;if(a.unlock&&a.unlock.by===old)a.unlock.by=nm;});
 if(E.mount.has(old)){E.mount.delete(old);E.mount.add(nm);}
 E.axis=E.axis.map(R);
 Object.values(E.presets).forEach(P=>{['st','g0','unl'].forEach(k=>{if(P[k])P[k]=P[k].map(R);});(P.tk||[]).forEach(t=>{t[0]=R(t[0]);t[1]=R(t[1]);});
  (P.ln||[]).forEach(L=>{L[2]=(L[2]||[]).map(R);if(L[4])L[4]=L[4].map(R);});});
 const qs=JSON.stringify([RAW.quests||[],RAW.events||[]]);if(qs.indexOf('"'+old+'"')>=0)toast('의뢰 · 이벤트 데이터가 옛 이름 「'+old+'」을 가리킬 수 있습니다. 검증에서 확인하십시오');
 return true;}
function delNode(i){const nm=E.nodes[i].n;push();E.nodes.splice(i,1);E.mount.delete(nm);E.axis=E.axis.filter(x=>x!==nm);
 E.nodes.forEach(n=>{const a=n.a||{};if(a.parent===nm){delete a.parent;delete a.acc;delete a.unlock;}if(a.unlock&&a.unlock.by===nm)delete a.unlock;if(a.only===nm)delete a.only;});
 Object.values(E.presets).forEach(P=>{['st','g0','unl'].forEach(k=>{if(P[k])P[k]=P[k].filter(x=>x!==nm);});P.tk=(P.tk||[]).filter(t=>t[0]!==nm&&t[1]!==nm);
  (P.ln||[]).forEach(L=>{L[2]=(L[2]||[]).filter(x=>x!==nm);});});
 sel={kind:null,i:-1};}

/* ------------------------------------------------------------------ 입력 */
let drag=null,spaceDown=false;const ptrs=new Map();
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('pointerdown',e=>{if(!E||!E.grid)return;cvs.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
 const X=e.offsetX,Y=e.offsetY,m=S2M(X,Y);
 if(ptrs.size===2){const a=[...ptrs.values()];if(drag&&drag.kind==='paint')drag=null;drag={kind:'pinch',d0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),sc0:view.sc,c0:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],v0:{...view}};return;}
 if(e.button===1||e.button===2||spaceDown||tool==='pan'){drag={kind:'pan',x:X,y:Y,px:view.px,py:view.py};return;}
 if(tab==='map'){
  if(tool==='paint'){push();drag={kind:'paint',last:m,mat:e.altKey?0:mat};paintAt(m[0],m[1],drag.mat);return;}
  if(tool==='fill'){fillAt(m[0],m[1],e.altKey?0:mat);return;}
  if(tool==='peak'){const k=peakAt(m[0],m[1]);push();if(k>=0)E.peaks.splice(k,1);else E.peaks.push([Math.round(m[0]),Math.round(m[1])]);draw();renderLeft();return;}
  if(tool==='calib'){const q=E.calib&&E.calib.next||0;push();E.calib=E.calib||{p:[{},{}],next:0};E.calib.p[q]=Object.assign(E.calib.p[q]||{},{x:r2(m[0]),y:r2(m[1])});E.calib.next=(q+1)%2;renderRight();draw();return;}}
 if(tab==='node'||tab==='chapter'){
  const i=nodeAt(X,Y);
  if(tab==='chapter'){if(i>=0){push();const nm=E.nodes[i].n,k=E.axis.indexOf(nm);if(k>=0)E.axis.splice(k,1);else E.axis.push(nm);renderAll();}return;}
  if(i>=0){sel={kind:'node',i};drag={kind:'move',i,ox:m[0]-E.nodes[i].x,oy:m[1]-E.nodes[i].y,moved:false};renderAll();return;}
  if(tool==='add'){if(m[0]<0||m[1]<0||m[0]>E.mw||m[1]>E.mh)return;push();
   E.nodes.push({n:uniqName('새 도시'),x:r2(m[0]),y:r2(m[1]),w:1,r:Math.min(E.regions.length-1,0),hub:0,a:{push:.5,pull:'일반시'}});
   sel={kind:'node',i:E.nodes.length-1};renderAll();setTimeout(()=>{const f=$('#nName');f&&(f.focus(),f.select());},0);return;}
  sel={kind:null,i:-1};renderAll();return;}
 if(tab==='region'){const i=nodeAt(X,Y);drag={kind:'reg'};push();if(i>=0){E.nodes[i].r=regPaint;draw();}return;}
 if(tab==='preset'){const P=curPreset();if(!P){toast('2챕터 이상이 있어야 프리셋을 그립니다');return;}const i=nodeAt(X,Y);
  if(lineEdit>=0){if(i<0)return;const L=P.ln[lineEdit];const nm=E.nodes[i].n;push();
   if(L[2][L[2].length-1]===nm)L[2].pop();else{L[2].push(nm);if(P.st.indexOf(nm)<0)P.st.push(nm);}renderAll();return;}
  if(i>=0){drag={kind:'tk',a:i,x:X,y:Y,cur:null};return;}
  const t=tkAt(X,Y);sel=t>=0?{kind:'tk',i:t}:{kind:null,i:-1};renderAll();return;}
});
cvs.addEventListener('pointermove',e=>{if(!E||!E.grid)return;const X=e.offsetX,Y=e.offsetY,m=S2M(X,Y);
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[X,Y]);
 hover={m,i:nodeAt(X,Y)};
 const ll=toLL(m[0],m[1]);$('#stPos').textContent='지도 '+Math.round(m[0])+', '+Math.round(m[1])+' · 경위도 '+ll[0].toFixed(3)+', '+ll[1].toFixed(3);
 if(!drag){draw();return;}
 if(drag.kind==='pinch'&&ptrs.size>=2){const a=[...ptrs.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);const c=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];
  const sc=Math.max(.05,Math.min(80,drag.v0.sc*d/Math.max(1,drag.d0)));const mx=(drag.c0[0]-drag.v0.px)/drag.v0.sc,my=(drag.c0[1]-drag.v0.py)/drag.v0.sc;
  view.sc=sc;view.px=c[0]-mx*sc;view.py=c[1]-my*sc;draw();return;}
 if(drag.kind==='pan'){view.px=drag.px+X-drag.x;view.py=drag.py+Y-drag.y;draw();return;}
 if(drag.kind==='paint'){paintLine(drag.last,m,drag.mat);drag.last=m;return;}
 if(drag.kind==='move'){const n=E.nodes[drag.i];if(!drag.moved){push();drag.moved=true;}n.x=r2(Math.max(0,Math.min(E.mw,m[0]-drag.ox)));n.y=r2(Math.max(0,Math.min(E.mh,m[1]-drag.oy)));draw();return;}
 if(drag.kind==='reg'){const i=nodeAt(X,Y);if(i>=0&&E.nodes[i].r!==regPaint){E.nodes[i].r=regPaint;draw();}return;}
 if(drag.kind==='tk'){drag.cur=[X,Y];draw();return;}
});
function endPtr(e){ptrs.delete(e.pointerId);if(!drag)return;const d=drag;
 if(d.kind==='pinch'){if(ptrs.size<2)drag=null;return;}
 drag=null;
 if(d.kind==='move'){if(d.moved)renderRight();return;}
 if(d.kind==='reg'){renderAll();return;}
 if(d.kind==='paint'){renderLeft();return;}
 if(d.kind==='tk'){const P=curPreset();const b=nodeAt(e.offsetX,e.offsetY);const A=E.nodes[d.a];
  if(b<0||b===d.a){// 누르기만 하면 역을 놓거나 뺀다
   if(Math.hypot(e.offsetX-d.x,e.offsetY-d.y)<6){push();const k=P.st.indexOf(A.n);if(k>=0){P.st.splice(k,1);P.g0=P.g0.filter(x=>x!==A.n);}else P.st.push(A.n);}
   renderAll();return;}
  const B=E.nodes[b],K=tkKey(A.n,B.n);const ti=P.tk.findIndex(t=>tkKey(t[0],t[1])===K);push();
  if(ti>=0)sel={kind:'tk',i:ti};else{P.tk.push([A.n,B.n,0,1]);sel={kind:'tk',i:P.tk.length-1};}
  [A.n,B.n].forEach(nm=>{if(P.st.indexOf(nm)<0)P.st.push(nm);});renderAll();return;}
}
cvs.addEventListener('pointerup',endPtr);cvs.addEventListener('pointercancel',endPtr);
cvs.addEventListener('pointerleave',()=>{hover=null;draw();});
cvs.addEventListener('wheel',e=>{if(!E||!E.grid)return;e.preventDefault();const k=Math.exp(-e.deltaY*.0015);const sc=Math.max(.05,Math.min(80,view.sc*k));
 const mx=(e.offsetX-view.px)/view.sc,my=(e.offsetY-view.py)/view.sc;view.sc=sc;view.px=e.offsetX-mx*sc;view.py=e.offsetY-my*sc;draw();},{passive:false});
window.addEventListener('keydown',e=>{const tg=e.target.tagName;const typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return;}
 if(typing)return;
 if(e.code==='Space'){spaceDown=true;e.preventDefault();}
 if((e.key==='Delete'||e.key==='Backspace')&&sel.kind==='node'&&tab==='node'){delNode(sel.i);renderAll();}
 if((e.key==='Delete'||e.key==='Backspace')&&sel.kind==='tk'&&tab==='preset'){const P=curPreset();push();P.tk.splice(sel.i,1);sel={kind:null,i:-1};renderAll();}
 if(e.key==='Escape'){if(lineEdit>=0){lineEdit=-1;renderAll();}else{sel={kind:null,i:-1};renderAll();}}
 if(e.key==='f'||e.key==='F'){fitView();draw();}
 if(tab==='map'){const k={'1':1,'2':0,'3':3,'4':2}[e.key];if(k!=null){mat=k;renderToolbar();renderRight();}
  if(e.key==='['){brush=Math.max(1,brush-1);renderRight();draw();}if(e.key===']'){brush=Math.min(40,brush+1);renderRight();draw();}}
});
window.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false;});
window.addEventListener('resize',resize);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

/* ------------------------------------------------------------------ 화면: 도구 막대 */
const TABS=[['meta','개요'],['map','지도'],['node','노드'],['region','권역'],['chapter','챕터'],['preset','프리셋'],['check','검증']];
function setTab(t){tab=t;lineEdit=-1;if(t==='map'&&['paint','fill','peak','calib','pan'].indexOf(tool)<0)tool='paint';
 if(t==='node'&&['select','add','pan'].indexOf(tool)<0)tool='select';sel=sel.kind==='node'&&(t==='node')?sel:{kind:null,i:-1};renderAll();}
function renderToolbar(){const tb=$('#toolbar');let h='';if(!E||!E.grid){tb.innerHTML='';return;}
 const B=(id,nm,ttl)=>'<button class="btn sm'+(tool===id?' on':'')+'" data-tool="'+id+'" title="'+esc(ttl||'')+'">'+nm+'</button>';
 if(tab==='map'){h+=B('paint','붓','끌어서 칠합니다 · Alt를 누르고 칠하면 바다')+B('fill','채우기','이어진 같은 색 영역을 한 번에')+B('peak','산 표시','누르면 산 표시를 놓고, 있는 것을 누르면 지웁니다')+B('calib','보정점','두 지점을 찍고 실제 경위도를 넣으면 투영을 계산합니다(지시서 8-8)')+B('pan','이동','');
  h+='<span style="width:8px"></span>'+MAT.map(M=>'<span class="sw'+(mat===M.id?' on':'')+'" data-mat="'+M.id+'" title="'+M.nm+'" style="background:rgb('+M.rgb.join(',')+')"></span>').join('');}
 else if(tab==='node')h+=B('select','고르기 · 옮기기','노드를 누르면 고르고, 끌면 옮깁니다')+B('add','도시 추가','빈 곳을 누르면 도시를 놓습니다')+B('pan','이동','');
 else if(tab==='region')h+=E.regions.map((nm,i)=>'<button class="btn sm'+(regPaint===i?' on':'')+'" data-reg="'+i+'"><span class="dot" style="display:inline-block;vertical-align:-1px;background:'+REGCOL[i%REGCOL.length]+'"></span> '+esc(nm)+'</button>').join('');
 else if(tab==='preset'){h+=E.chapters.map((c,i)=>i?'<button class="btn sm'+(presetCh===i?' on':'')+'" data-pch="'+i+'">'+(i+1)+'챕터 · '+c.y0+'</button>':'').join('');
  if(lineEdit>=0)h+='<button class="btn sm on" data-endline="1">노선 편집 끝 (Esc)</button>';}
 h+='<button class="btn sm" data-fit="1" title="F">전체 보기</button>';
 tb.innerHTML=h;
 const hint={paint:'끌어서 칠하기 · [ ] 붓 크기 · 1~4 색',fill:'누른 곳과 이어진 같은 색을 채웁니다',peak:'산 표시 놓기 · 지우기',calib:'보정점 '+((E&&E.calib&&E.calib.next||0)+1)+'을 찍을 차례',
  select:'노드를 끌어 옮기기 · Delete로 지우기',add:'빈 곳을 눌러 도시 추가',pan:'끌어서 지도 이동'};
 $('#stTool').textContent=tab==='region'?'노드를 누르거나 끌어 지나가면 고른 지역으로 칠합니다':tab==='chapter'?'노드를 누르면 주축에 넣고 빼기':tab==='preset'?(lineEdit>=0?'역을 차례로 눌러 노선 정차역을 잇습니다 · 마지막 역을 다시 누르면 뺍니다':'노드 누르기 = 역 놓기/빼기 · 역에서 역으로 끌기 = 선로'):(hint[tool]||'');
 $('#stTool').textContent+=' · 휠 확대 · 오른쪽 끌기 또는 스페이스 끌기로 이동';}
$('#toolbar').addEventListener('click',e=>{const t=e.target.closest('[data-tool],[data-mat],[data-reg],[data-pch],[data-fit],[data-endline]');if(!t)return;
 if(t.dataset.tool){tool=t.dataset.tool;if(tool==='calib'&&!E.calib){E.calib={p:[{},{}],next:0};}}
 if(t.dataset.mat!=null){mat=+t.dataset.mat;tool=tool==='fill'?'fill':'paint';}
 if(t.dataset.reg!=null)regPaint=+t.dataset.reg;
 if(t.dataset.pch!=null){presetCh=+t.dataset.pch;sel={kind:null,i:-1};lineEdit=-1;}
 if(t.dataset.endline){lineEdit=-1;}
 if(t.dataset.fit){fitView();}
 renderAll();});

/* ------------------------------------------------------------------ 화면: 왼쪽 */
let nodeQ='';
function renderLeft(){const L=$('#left');if(!E||!E.grid){L.innerHTML='';return;}
 let h='<div class="tabs">'+TABS.map(([id,nm])=>'<button class="'+(tab===id?'on':'')+'" data-tab="'+id+'">'+nm+'</button>').join('')+'</div>';
 if(tab==='meta'){h+='<div class="sec"><h3>이 시나리오</h3><div class="hint">'+esc(E.meta.title||'(제목 없음)')+' · '+esc(E.meta.id)+' · 판 '+esc(E.meta.ver)+'</div>'
  +'<p class="hint">지도 '+Math.round(E.mw)+' × '+Math.round(E.mh)+' (약 '+Math.round(E.mw*E.kmpp)+' × '+Math.round(E.mh*E.kmpp)+'km)<br>노드 '+E.nodes.length+' · 챕터 '+E.chapters.length+' · 의뢰 '+((RAW.quests||[]).length)+' · 사건 '+((RAW.events||[]).length)+'</p></div>'

  +'<li><b>노드</b> — 도시를 놓고 인구 가중 · 성격을 정합니다. 첫 노드가 수도입니다</li>'

  +'<li><b>챕터</b> — 연도, 시작자본, 목표 셋 이하, 주축</li>'
  +'<li><b>프리셋</b> — 2챕터부터 물려받는 철도망</li>'

  +'<div class="sec"><h3>게임에서 여는 법</h3><p class="hint">타이틀 → 새 게임 → 맵 고르기 → <b>시나리오 파일 불러오기</b>에서 내보낸 JSON을 고릅니다.</p></div>';}
 else if(tab==='map'){const cnt=[0,0,0,0];E.grid.mask.forEach(v=>cnt[v]++);const T=E.grid.W*E.grid.H;
  h+='<div class="sec"><h3>칸 구성</h3>'+MAT.map(M=>'<div class="row"><span class="dot" style="background:rgb('+M.rgb.join(',')+')"></span><span style="flex:1">'+M.nm+'</span><span class="hint">'+(cnt[M.id]/T*100).toFixed(1)+'%</span></div>').join('')
  +'<p class="hint">게임은 파란 칸을 바다로, 흰 칸을 육지로, 회색 칸을 바깥 땅(외국 등)으로 그립니다.</p></div>'
  +'<div class="sec"><h3>산 표시 '+E.peaks.length+'개</h3><p class="hint">지도에 그리는 삼각형 표시입니다. 실제 공사비 할증은 권역 탭의 지역 코드 1번과 노드의 「산악 지명」이 정합니다.</p>'
  +(E.peaks.length?'<button class="btn sm bad" data-act="clrPeaks">산 표시 모두 지우기</button>':'')+'</div>';}

/* ------------------------------------------------------------------ 파일 */
function dl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),300);}
function doExport(){const R=checkAll();if(R.err.length){setTab('check');toast('검증 오류가 있어 내보내지 않았습니다');return;}
 const b=new Blob([JSON.stringify(R.S)],{type:'application/json'});const u=URL.createObjectURL(b);
 dl(u,(E.meta.id||'scenario')+'-'+(E.meta.ver||'0')+'.json');setTimeout(()=>URL.revokeObjectURL(u),1000);dirty=false;
 toast(R.warn.length?'내보냈습니다 · 경고 '+R.warn.length+'건은 검증 탭에서 확인하십시오':'내보냈습니다');}
$('#bExport').onclick=doExport;
$('#bCheck').onclick=()=>setTab('check');
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#bOpen').onclick=()=>$('#fOpen').click();
$('#fOpen').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();
 rd.onload=()=>{let o;try{o=JSON.parse(rd.result);}catch(_){toast('JSON을 읽지 못했습니다');return;}
  if(!o||typeof o!=='object'||!o.map||!Array.isArray(o.nodes)){toast('시나리오 파일이 아닙니다 (map · nodes가 없음)');return;}
  if(dirty&&!confirm('저장하지 않은 작업이 있습니다. 열까요?'))return;
  o.__from='file';loadScenario(o).then(()=>{const er=validScen(o);toast(f.name+' 열기'+(er.length?' · 원본 검증 오류 '+er.length+'건':''));});};
 rd.readAsText(f);};
$('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const u=URL.createObjectURL(f);const im=new Image();
 im.onload=()=>{refImg=im;refShow=true;renderAll();toast('참고 이미지를 깔았습니다');};im.src=u;};
$('#bNew').onclick=()=>openNew();

function openNew(first){
 const d=document.createElement('div');d.className='dlg';
 d.innerHTML='<div class="box"><h2>'+(first?'Everyline 맵 제작기':'새 지도')+'</h2>'
 +(first?'<p class="hint">Everyline: Rail의 유저 시나리오(맵)를 만들어 JSON 하나로 내보냅니다. 게임의 「시나리오 파일 불러오기」로 엽니다.</p>':'')
 +'<div class="opt on" data-k="blank"><b>빈 지도에서 시작</b><span>바다만 있는 지도에 육지를 칠하고 도시를 놓습니다. 시스템 값은 한국 시나리오를 빌립니다</span></div>'
 +'<div class="opt" data-k="gr"><b>가람 지방을 고쳐 쓰기</b><span>튜토리얼의 작은 가상 지방(도시 일곱)을 바탕으로 합니다</span></div>'
 +'<div class="opt" data-k="kr"><b>한국 시나리오 열기</b><span>게임 기본 시나리오 전체(노드 '+((BASE_KR&&BASE_KR.nodes||[]).length)+'곳 · 챕터 넷 · 의뢰 · 사건 포함)를 엽니다</span></div>'
 +'<div id="blankOpt"><div class="sec" style="padding:8px 0;border:none"><div class="grid2">'
 +F.text('nwId','식별자','mymap')+F.text('nwTitle','제목','새 지방')+F.num('nwW','가로 칸',300,'1')+F.num('nwH','세로 칸',220,'1')+F.num('nwCs','칸 크기',2,'0.1')+F.num('nwKm','km/단위',.52235,'0.0001')
 +'</div>'+F.sel('nwFill','처음 칸',0,[[0,'모두 바다'],[1,'모두 육지']])+'<p class="hint">한국 지도는 438 × 600칸, 칸 크기 2, 0.522km/단위(약 457 × 627km)입니다.</p></div></div>'
 +'<div class="row" style="justify-content:flex-end;margin-top:10px">'+(first?'':'<button class="btn" data-x="cancel">취소</button>')+'<button class="btn pri" data-x="ok">시작</button></div></div>';
 document.body.appendChild(d);let k='blank';
 d.addEventListener('click',e=>{const o=e.target.closest('.opt');if(o){k=o.dataset.k;d.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===o));d.querySelector('#blankOpt').style.display=k==='blank'?'':'none';}
  const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='cancel'){d.remove();return;}
  if(!first&&dirty&&!confirm('저장하지 않은 작업이 사라집니다. 계속할까요?'))return;
  if(k==='blank'){const id=(d.querySelector('#nwId').value||'mymap').trim();const W=Math.max(8,tq(d.querySelector('#nwW').value,300)|0),H=Math.max(8,tq(d.querySelector('#nwH').value,220)|0);
   const b=blankScenario({id,title:d.querySelector('#nwTitle').value||'새 지방',W,H,cs:Math.max(.1,tq(d.querySelector('#nwCs').value,2)),kmpp:tq(d.querySelector('#nwKm').value,.52235),fill:+d.querySelector('#nwFill').value});
   b.raw.__from='blank';loadScenario(b.raw,{W:b.W,H:b.H,mask:b.mask});tab='map';tool='paint';mat=1;}
  else{const src=clone(k==='kr'?BASE_KR:BASE_GR);src.__from=k;src.id=src.id+'_mod';src.title=src.title+' (수정본)';delete src.hidden;
   loadScenario(src).then(()=>{tab='meta';renderAll();toast('기본 시나리오와 겹치지 않게 식별자를 '+src.id+'로 바꿔 두었습니다');});}
  d.remove();renderAll();});
}

/* ------------------------------------------------------------------ 공통 */
let toastT=0;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
function renderBadge(){if(!E||!E.grid)return;const R=checkAll();const b=$('#hBadge');b.textContent=R.err.length||'✓';b.className='badge'+(R.err.length?'':' ok');
 b.title=R.err.length?'검증 오류 '+R.err.length+'건':'게임 로더 검증 통과';$('#hName').textContent=(E.meta.title||'')+' · '+(E.meta.id||'');}
let badgeT=0;
function renderAll(){renderLeft();renderRight();renderToolbar();draw();clearTimeout(badgeT);badgeT=setTimeout(renderBadge,120);
 $('#bUndo').disabled=!UNDO.length;$('#bRedo').disabled=!REDO.length;}
$('#hVer').textContent='게임 '+(typeof GAME_VER!=='undefined'?GAME_VER:'');
// 처음 화면: 가람 지방을 열어 둔 채로 시작 대화상자를 띄운다
resize();
{const g=clone(BASE_GR);g.__from='gr';g.id='garam_mod';g.title='가람 지방 (수정본)';delete g.hidden;
 loadScenario(g).then(()=>{resize();fitView();renderAll();openNew(true);});}
})();
</script>
</body>
</html>
