<style>
:root{
  --ink:#16150f; --ink2:#1f1d16; --ink3:#2b2820;

}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── 머리말 ── */
header{display:flex;align-items:baseline;gap:18px;padding:14px 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:.06em;margin:0}
header h1 span{color:var(--gold)}
header .sub{font-size:12px;color:var(--dim);letter-spacing:.04em;margin-right:auto}
header .search{position:relative}
header .ftoggle{display:none;margin-left:auto;align-items:center;gap:6px;font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--text2)}
header .ftoggle span{font-size:10px;display:inline-block;transition:transform .18s}
header .ftoggle.closed span{transform:rotate(-90deg)}
header .ftoggle.closed{border-color:var(--gold);color:var(--text)}
header input{background:var(--ink2);border:1px solid var(--line);color:var(--text);padding:7px 12px 7px 30px;width:210px;font-size:13px;border-radius:2px}
header input::placeholder{color:#6e685a}
header .search::before{content:"⌕";position:absolute;left:10px;top:5px;color:var(--dim);font-size:15px}

/* ── 여과기 ── */
.filters{display:flex;gap:20px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:11px;color:var(--dim);letter-spacing:.18em;margin-right:4px}
.chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--text2);white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--dim);color:var(--text)}
.chip.on{background:var(--ink3);border-color:var(--gold);color:var(--text)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chip.era.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(201,162,39,.25)}

/* ── 본체 ── */
main{flex:1;display:flex;min-height:0}

/* 연표 축 */
.rail{width:72px;flex:none;border-right:1px solid var(--line);position:relative;background:var(--ink2)}
.rail svg{width:100%;height:100%;display:block;touch-action:none;cursor:ns-resize}
.rail .rtitle{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2em;color:#5f5949;pointer-events:none}

/* 지도 */
.mapwrap{flex:1;position:relative;min-width:0;background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.zoombtn{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoombtn button{width:28px;height:28px;background:rgba(22,21,15,.86);border-radius:2px;font-size:15px;line-height:1}
.scalebar{position:absolute;left:14px;bottom:12px;font-size:10px;color:#3f3a2c;text-align:center}
.scalebar div{border:1px solid #3f3a2c;border-top:none;height:5px}

/* 안내판 */
.panel{width:352px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--ink2);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:10px 4px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent;letter-spacing:.06em}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.tabs button b{font-family:var(--serif);font-size:11px;color:var(--dim);margin-left:4px;font-weight:400}
.plist{overflow-y:auto;flex:1;min-height:0}
.item{padding:11px 16px;border-bottom:1px solid #262319;cursor:pointer;display:flex;gap:11px;align-items:baseline}
.item:hover{background:var(--ink3)}
.item.on{background:var(--ink3);box-shadow:inset 3px 0 0 var(--gold)}
.item .yr{font-family:var(--serif);font-size:15px;color:var(--gold);flex:none;width:38px;letter-spacing:.02em}
.item .nm{font-size:13.5px}
.item .pl{font-size:11px;color:var(--dim);margin-top:1px}
.item .bar{width:3px;align-self:stretch;flex:none;border-radius:2px}
.empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:12.5px}
.item .txt{flex:1;min-width:0}
.star{flex:none;margin-left:auto;align-self:center;font-size:16px;line-height:1;color:#59533f;padding:4px 2px;transition:.12s}
.star:hover{color:var(--text2)}
.star.on{color:var(--gold)}
.sechead{padding:12px 16px 6px;font-size:11px;letter-spacing:.16em;color:var(--dim);border-bottom:1px solid #262319}
.savebar{padding:14px 16px 28px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.savebar button{font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:2px;color:var(--text2)}
.savebar button:hover{border-color:var(--gold);color:var(--text)}
.iobox{padding:0 16px 24px}
.iobox textarea{width:100%;height:96px;background:var(--ink3);border:1px solid var(--line);color:var(--text);font-size:11px;padding:8px;border-radius:2px;font-family:ui-monospace,monospace}
.iobox .msg{font-size:11.5px;color:var(--dim);margin:6px 0}
#printSheet{display:none}
.patch{padding:6px 18px 40px}
.patch .ver{margin:16px 0 0;padding:14px 0 4px;border-top:1px solid #262319}
.patch .ver:first-child{border-top:none}
.patch .vnum{font-family:var(--serif);font-size:17px;color:var(--gold)}
.patch .vdate{font-size:11px;color:var(--dim);margin-left:8px;letter-spacing:.04em}
.patch .vnow{font-size:10px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 7px;margin-left:8px;letter-spacing:.08em}
.patch ul{margin:8px 0 0;padding-left:16px}
.patch li{font-size:13px;color:#d5cebc;margin-bottom:5px}
.patch li b{font-weight:400;color:var(--text2)}
.detail .savebtn{margin:0 0 14px;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:2px;color:var(--text2)}
.detail .savebtn.on{border-color:var(--gold);color:var(--gold)}

/* 상세 */
.detail{overflow-y:auto;flex:1;min-height:0;padding:18px 18px 40px}
.detail .back{font-size:11px;color:var(--dim);letter-spacing:.1em;margin-bottom:14px}
.detail .back:hover{color:var(--text)}
.detail .kicker{font-size:11px;letter-spacing:.16em;color:var(--dim);margin-bottom:6px}
.detail h2{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 4px;line-height:1.35}
.detail .meta{font-size:12px;color:var(--text2);margin-bottom:14px}
.detail .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--text2)}
.tag.cat{color:#fff}
.detail p{font-size:13.5px;color:#d5cebc;margin:0 0 12px}
.detail h3{font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:400;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.link{font-size:12.5px;padding:5px 11px;background:var(--ink3);border:1px solid var(--line);border-radius:2px;color:var(--text)}
.link:hover{border-color:var(--gold)}
.link .yr{color:var(--dim);font-size:11px;margin-left:5px}
.quote{font-family:var(--serif);font-size:14px;color:var(--text2);border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin:14px 0}

/* 지도 요소 */
.landfill{fill:var(--paper);stroke:var(--coast);stroke-linejoin:round}
.island{fill:var(--paper2);stroke:var(--coast)}
.borderline{fill:none;stroke:#9b8a68;stroke-dasharray:5 4}
.grid{stroke:#a9b4b4;fill:none;opacity:.55}
.route{fill:none;stroke:#255a80;stroke-dasharray:2 6;stroke-linecap:round;opacity:.85}
.citylab{fill:#6d6047;font-family:var(--sans);letter-spacing:.02em;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.evlab{fill:#2a251a;font-family:var(--sans);paint-order:stroke;stroke:rgba(236,226,202,.92);stroke-linejoin:round;pointer-events:none}
.mk{cursor:pointer}
.mk circle.core{stroke:#f3ecd8;stroke-opacity:.9}
.mk:hover circle.core{stroke:var(--ink)}
.mk .cnt{fill:#fff;font-weight:600;text-anchor:middle;pointer-events:none;font-family:var(--sans)}
.sel-ring{fill:none;stroke:var(--gold);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:rgba(22,21,15,.94);color:var(--text);padding:6px 10px;border-radius:2px;font-size:12px;white-space:nowrap;transform:translate(-50%,-140%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip .t2{color:var(--dim);font-size:11px}

/* 연표 */
.rail .tick{stroke:#3b372c}
.rail .ticklab{fill:var(--dim);font-size:9px;font-family:var(--serif)}
.rail .sel{fill:rgba(201,162,39,.13);stroke:var(--gold);stroke-opacity:.5}
.rail .edot{stroke:none}

@media print{
  html,body{height:auto;background:#fff}
  .app{display:none!important}
  #printSheet{display:block;color:#171410;font-family:var(--sans)}
  #printSheet h1{font-family:var(--serif);font-size:21pt;font-weight:400;margin:0 0 3pt}
  #printSheet .psub{font-size:9pt;color:#5a5548;border-bottom:.5pt solid #9a927f;padding-bottom:7pt;margin-bottom:12pt}
  #printSheet h2{font-size:9pt;letter-spacing:.16em;color:#6b6455;font-weight:400;margin:14pt 0 5pt}
  #printSheet .pit{margin:0 0 10pt;padding-left:7pt;border-left:2pt solid #9a927f;break-inside:avoid;page-break-inside:avoid}
  #printSheet .pit .pt{font-size:12pt}
  #printSheet .pit .py{font-family:var(--serif);color:#8a6d15;margin-right:6pt}
  #printSheet .pit .pm{font-size:8.5pt;color:#6b6455;margin:1pt 0 3pt}
  #printSheet .pit p{font-size:9.5pt;line-height:1.55;margin:0;color:#2a261e}
  #printSheet .pit .px{font-size:8.5pt;color:#5a5548;margin-top:3pt}
  #printSheet .pft{margin-top:16pt;padding-top:6pt;border-top:.5pt solid #9a927f;font-size:8pt;color:#6b6455}
  @page{margin:15mm}
}
@media (max-width:1100px){
  .panel{width:312px}
}
@media (max-width:900px){
  header{padding:10px 14px;gap:10px}
  header h1{font-size:18px}
  header .sub{display:none}
  header .ftoggle{display:inline-flex}
  header .search{flex:1;min-width:0;order:3;width:100%}
  header input{width:100%}
  .filters{gap:10px 14px;padding:10px 14px;max-height:38vh;overflow-y:auto}
  .filters.closed{display:none}
  .fgroup{gap:5px}
  .chip{font-size:12.5px;padding:5px 11px}
  main{flex-direction:column;overflow:hidden}
  .rail{width:100%;height:54px;flex:none;border-right:none;border-bottom:1px solid var(--line)}
  .rail .rtitle{display:none}
  .mapwrap{height:44vh;flex:none}
  .panel{width:100%;flex:1;min-height:0;border-left:none;border-top:1px solid var(--line)}
  .zoombtn button{width:34px;height:34px;font-size:17px}
  .detail{padding:16px 16px 32px}
  .item{padding:13px 16px}
}
@media (max-width:900px) and (max-height:700px){
  .mapwrap{height:38vh}
}

 {id:39,ys:1926,y:"1926.12",n:"나석주 동양척식주식회사 의거",s:"seoul",cat:"yeol",o:["uiyeoldan"],m:["nasukju"],

 {id:40,ys:1923,y:"1923",n:"참의부 성립",s:"jian",cat:"armed",o:["chamuibu"],m:[],

 {id:41,ys:1924,y:"1924",n:"정의부 성립",s:"jilin",cat:"armed",o:["jeonguibu"],m:["yangsebong"],

 {id:43,ys:1926,y:"1926.6.10",n:"6·10 만세운동",s:"seoul",cat:"mass",o:[],m:[],

 {id:51,ys:1931,y:"1921·1931",n:"조선어연구회와 조선어학회",s:"seoul",cat:"cult",o:["eohakhoe"],m:["iyunjae","choehyeonbae"],

 {id:64,ys:1937,y:"1932~40",n:"임시정부의 이동과 창사 시기",s:"changsha",cat:"dip",o:["kpg"],m:["kimgu"],

 {id:68,ys:1944,y:"1944.8",n:"조선건국동맹 결성",s:"seoul",cat:"dip",o:["geongukdongmaeng"],m:["yeounhyeong"],

 {id:"uibyeong",n:"의병",y:"1895~1915",d:"국가의 명령 없이 백성이 스스로 일으킨 군대다. 을미·을사·정미의병으로 이어지며 유생 중심에서 평민·해산군인 중심으로 성격이 바뀌었고, 남한대토벌 이후 만주·연해주로 옮겨 독립군의 모체가 되었다."},
 {id:"sinminhoe",n:"신민회",y:"1907~1911",d:"안창호·양기탁·이승훈 등이 만든 비밀결사. 공화정 수립을 목표로 학교·회사 설립의 실력양성과 국외 무관학교 건설을 함께 추진했다. 105인 사건으로 해체됐으나 구성원들이 서간도 기지 개척으로 이어갔다."},
 {id:"gwoneophoe",n:"권업회",y:"1911~1914",d:"연해주 신한촌을 근거지로 한 한인 자치·독립운동 단체. 권업신문을 내고 학교를 운영했으며 대한광복군정부 수립의 기반이 되었다."},
 {id:"gwangbokhoe",n:"대한광복회",y:"1915~1918",d:"박상진을 총사령으로 한 국내 최대 비밀결사. 상업 조직을 위장 거점 삼아 군자금을 모아 만주로 보냈고 친일 부호 처단을 병행했다. 공화주의를 지향한 점에서 의병 계열과 구분된다."},
 {id:"sinheung",n:"신흥무관학교",y:"1911~1920",d:"서간도 삼원보에서 출발한 독립군 사관학교. 이회영 일가와 이상룡 등이 재산을 처분해 세웠고 3,500여 명의 졸업생이 청산리 전투와 의열단, 뒷날 광복군의 간부가 되었다."},
 {id:"bukro",n:"북로군정서",y:"1919~1920",d:"대종교 계열 중광단을 모체로 북간도에서 조직된 무장단체. 김좌진이 총사령으로 사관연성소를 두었고 청산리 대첩의 주력이었다."},
 {id:"daehandokrip",n:"대한독립군",y:"1919~1920",d:"홍범도가 이끈 부대로 국내 진공작전을 활발히 폈다. 봉오동에서 일본군을 격파하고 청산리에서도 연합작전에 참여했다."},
 {id:"kpg",n:"대한민국 임시정부",y:"1919~1945",d:"국호 대한민국과 민주공화제를 처음으로 헌장에 담은 정부. 연통제·교통국으로 국내와 연결하고 외교·군사·선전을 총괄했다. 국민대표회의(1923)로 노선 갈등을 겪었고, 이동기를 거쳐 충칭에서 광복군 창설과 건국강령 발표로 위상을 회복했다."},
 {id:"uiyeoldan",n:"의열단",y:"1919~1935",d:"김원봉이 조직한 의열투쟁 단체. 조선혁명선언을 강령으로 삼아 요인 처단과 식민기구 파괴를 실행했고, 뒤에는 황푸군관학교 입교와 조선혁명간부학교 운영을 통해 조직적 무장투쟁으로 방향을 바꿨다."},
 {id:"chamuibu",n:"참의부",y:"1923~1929",d:"임시정부 직할 군사조직으로 압록강 접경을 관할하며 국내 진공을 자주 시도했다."},
 {id:"jeonguibu",n:"정의부",y:"1924~1929",d:"남만주 한인사회의 행정·사법·군사를 아우른 자치조직. 산하 무장력이 조선혁명군으로 이어졌다."},
 {id:"sinminbu",n:"신민부",y:"1925~1929",d:"북만주에서 자유시 참변 이후 재결집한 조직. 김좌진이 군사부를 맡고 성동사관학교를 운영했다."},
 {id:"singanhoe",n:"신간회",y:"1927~1931",d:"'민족 유일당' 원칙 아래 민족주의 좌파와 사회주의자가 결성한 합법단체. 강연회와 야학, 소작·노동쟁의 지원을 했고 광주학생운동 진상 규명 활동으로 탄압받았다. 자매단체로 여성운동 조직인 근우회가 있었다."},
 {id:"hyeongpyeongsa",n:"조선형평사",y:"1923~1935",d:"백정 차별 철폐를 내걸고 진주에서 창립한 단체. 저울처럼 평등한 사회를 표방했고 뒤에 민족·사회운동과 결합했다."},
 {id:"eohakhoe",n:"조선어학회",y:"1921~1942",d:"조선어연구회에서 출발해 한글 맞춤법 통일안과 표준어를 정리하고 사전 편찬을 추진했다. 1942년 조선어학회 사건으로 강제 해산됐다."},
 {id:"aegukdan",n:"한인애국단",y:"1931~1935",d:"침체된 임시정부의 활로를 뚫기 위해 김구가 만든 의열조직. 이봉창·윤봉길 의거를 통해 임정의 존재를 국제사회에 알렸다."},
 {id:"hangukdokripgun",n:"한국독립군",y:"1931~1934",d:"한국독립당의 무장조직으로 지청천이 지휘했다. 북만주에서 중국 호로군과 연합해 쌍성보·대전자령에서 승리했고 뒤에 관내로 이동해 광복군의 토대가 되었다."},
 {id:"joseonhyeokmyeonggun",n:"조선혁명군",y:"1929~1938",d:"남만주에서 양세봉이 이끈 부대. 중국의용군과 연합해 영릉가·흥경성에서 싸웠으며 만주 무장투쟁의 마지막 축이었다."},
 {id:"hangilyeongun",n:"동북항일연군",y:"1936~1940",d:"중국공산당 계열 만주 항일부대로 한인이 다수 참여했다. 조국광복회를 통해 국내와 연결을 시도했고 보천보 습격을 벌였다."},
 {id:"minhyeokdang",n:"민족혁명당",y:"1935~1940년대",d:"중국 관내 독립운동 정당들의 통합체. 좌우 노선 차이로 분화했지만 조선의용대의 모체가 되었고 뒤에 임정에 합류해 좌우 통합의 계기를 만들었다."},
 {id:"uiyongdae",n:"조선의용대",y:"1938~1942",d:"중국 관내 최초의 한인 무장부대. 주력이 화북으로 이동해 조선의용군이 되었고, 김원봉과 남은 대원은 한국광복군에 합류했다."},
 {id:"dokripdongmaeng",n:"조선독립동맹",y:"1942~1946",d:"옌안을 근거지로 한 사회주의 계열 독립운동 단체. 산하 조선의용군이 팔로군과 함께 항일전을 폈다."},
 {id:"gwangbokgun",n:"한국광복군",y:"1940~1946",d:"임시정부의 정규군. 대일 선전포고, 인도·미얀마 전선 연합작전, OSS 합동훈련을 통해 연합군의 일원으로 참전하려 했다."},
 {id:"geongukdongmaeng",n:"조선건국동맹",y:"1944~1945",d:"여운형이 국내에서 조직한 비밀결사로 해방 후 건국준비위원회로 이어졌다."}
];

 {id:"angyuhong",n:"안규홍",l:"1879~1911",r:"의병장",d:"머슴 출신 의병장으로 전남 보성 일대에서 활동했고 남한대토벌 때 체포됐다."},

 {id:"anchangho",n:"안창호",l:"1878~1938",r:"신민회·흥사단·임시정부",d:"실력양성론을 대표하는 인물로 대성학교와 흥사단을 세웠다. 임시정부 내무총장 겸 국무총리 대리로 조직의 기틀을 세웠고, 윤봉길 의거 뒤 체포되어 옥고 끝에 순국했다."},
 {id:"yanggitak",n:"양기탁",l:"1871~1938",r:"언론인·신민회",d:"대한매일신보를 통해 국채보상운동을 지원했고 신민회를 이끌었다. 105인 사건으로 투옥된 뒤 만주에서 활동했다."},
 {id:"iseunghun",n:"이승훈",l:"1864~1930",r:"교육가·민족대표",d:"상인 출신으로 오산학교를 세웠고 3·1운동 때 기독교계를 대표해 민족대표로 참여했다."},
 {id:"anjunggeun",n:"안중근",l:"1879~1910",r:"대한의군 참모중장",d:"연해주에서 의병 활동을 하다 하얼빈에서 이토 히로부미를 사살했다. 옥중에서 『동양평화론』을 집필하다 순국했다."},
 {id:"ihoeyeong",n:"이회영",l:"1867~1932",r:"신흥무관학교·아나키스트",d:"6형제가 전 재산을 처분해 서간도로 망명, 신흥무관학교를 세웠다. 뒤에 아나키즘 계열 항일운동을 하다 다롄에서 고문사했다."},
 {id:"isangryong",n:"이상룡",l:"1858~1932",r:"임시정부 국무령",d:"안동의 유력 가문 출신으로 만주 자치기구 경학사·부민단을 이끌었고 임시정부 초대 국무령을 지냈다."},
 {id:"isangseol",n:"이상설",l:"1870~1917",r:"헤이그 특사·대한광복군정부",d:"서전서숙을 세우고 헤이그 만국평화회의에 특사로 파견됐다. 연해주에서 대한광복군정부 정통령을 맡았다."},
 {id:"idonghwi",n:"이동휘",l:"1873~1935",r:"임시정부 국무총리",d:"대한제국 군인 출신으로 무장투쟁을 주장했다. 한인사회당을 조직한 사회주의 계열 지도자로 임정 국무총리를 맡았으나 노선 차이로 사퇴했다."},
 {id:"kimyakyeon",n:"김약연",l:"1868~1942",r:"명동학교 설립자",d:"북간도 명동촌을 개척하고 명동학교를 세워 '간도 대통령'으로 불렸다."},
 {id:"seoil",n:"서일",l:"1881~1921",r:"북로군정서 총재",d:"대종교 지도자로 중광단을 조직하고 북로군정서를 이끌었다. 간도참변 뒤 자결했다."},
 {id:"baksangjin",n:"박상진",l:"1884~1921",r:"대한광복회 총사령",d:"판사 임용을 거부하고 상업 조직을 위장 삼아 군자금을 모았다. 친일 부호 처단을 지휘하다 체포되어 순국했다."},
 {id:"kimjwajin",n:"김좌진",l:"1889~1930",r:"북로군정서 총사령",d:"가노비 문서를 불태우고 학교를 세운 뒤 만주로 망명했다. 청산리 대첩을 지휘했고 신민부를 이끌다 암살됐다."},
 {id:"hongbeomdo",n:"홍범도",l:"1868~1943",r:"대한독립군 총사령",d:"포수 출신 의병장으로 봉오동·청산리에서 활약했다. 자유시 참변 뒤 소련에 남았고 1937년 중앙아시아 강제이주로 카자흐스탄에서 생을 마쳤다."},
 {id:"ibeomseok",n:"이범석",l:"1900~1972",r:"광복군 참모장",d:"신흥무관학교 교관으로 청산리 전투에 참여했고, 한국독립군과 광복군에서 지휘를 맡아 OSS 합동작전을 준비했다."},
 {id:"jicheongcheon",n:"지청천",l:"1888~1957",r:"광복군 총사령",d:"일본 육사 출신으로 만주로 망명해 한국독립군을 지휘했고 쌍성보·대전자령에서 승리했다. 한국광복군 총사령을 맡았다."},

 {id:"kimwonbong",n:"김원봉",l:"1898~1958",r:"의열단·조선의용대",d:"의열단을 창단해 의열투쟁을 이끌었고 조선혁명간부학교와 민족혁명당, 조선의용대를 조직했다. 뒤에 임시정부 군무부장을 맡았고 해방 후 월북했다."},

 {id:"kimgu",n:"김구",l:"1876~1949",r:"임시정부 주석·한인애국단",d:"한인애국단을 조직해 이봉창·윤봉길 의거를 기획했고 임정을 이끌며 광복군을 창설했다. 해방 후 통일정부 수립을 주장하다 암살됐다."},

let saved={e:new Set(),o:new Set(),p:new Set(),a:new Set()}, onlySaved=false, storageOk=true;

  try{localStorage.setItem(SKEY,JSON.stringify({e:[...saved.e],o:[...saved.o],p:[...saved.p],a:[...saved.a]}));}

}

function updateScale(){

  $("#scaleTxt").textContent=best+"km";$("#scaleBar").style.width=w.toFixed(0)+"px";
}

function drawMarkers(){
  const k=unitsPerPx(), mob=window.innerWidth<=900;
  gMk.textContent="";gLab.textContent="";
  const rel=relatedIds();
  const list=filtered().slice();
  EV.forEach(e=>{if(rel.has(e.id)&&!list.includes(e))list.push(e);});
  const bySite={};
  list.forEach(e=>{(bySite[e.s]=bySite[e.s]||[]).push(e);});

  // 화면상 너무 가까운 지점은 하나로 묶어 겹침을 막는다
  const nodes=Object.entries(bySite).map(([sk,evs])=>({sites:[sk],evs,x:px(S[sk][0]),y:py(S[sk][1])}));
  const gap=(mob?15:17)*k;
  for(let again=true;again;){
    again=false;
    for(let i=0;i<nodes.length&&!again;i++)for(let j=i+1;j<nodes.length;j++){
      const A=nodes[i],B=nodes[j];
      if(Math.hypot(A.x-B.x,A.y-B.y)<gap){
        const t=A.evs.length+B.evs.length;
        A.x=(A.x*A.evs.length+B.x*B.evs.length)/t;A.y=(A.y*A.evs.length+B.y*B.evs.length)/t;
        A.evs=A.evs.concat(B.evs);A.sites=A.sites.concat(B.sites);
        nodes.splice(j,1);again=true;break;
      }
    }
  }

  nodes.forEach(nd=>{
    const evs=nd.evs, n=evs.length, one=nd.sites.length===1;
    const counts={};evs.forEach(e=>counts[e.cat]=(counts[e.cat]||0)+1);
    const top=Object.entries(counts).sort((x,y)=>y[1]-x[1])[0][0];
    const bySiteCnt={};evs.forEach(e=>bySiteCnt[e.s]=(bySiteCnt[e.s]||0)+1);
    const mainSite=Object.entries(bySiteCnt).sort((x,y)=>y[1]-x[1])[0][0];
    const nm=one?S[nd.sites[0]][2]:S[mainSite][2]+" 외 "+(nd.sites.length-1)+"곳";
    const isRel=evs.some(e=>rel.has(e.id)), dim=rel.size&&!isRel;
    const r=(n>1?8.5:6.5)*(mob?.78:1)*k;
    nd.r=r;

    const isSel=(sel.type==="site"&&nd.sites.includes(sel.id))||(sel.type==="event"&&evs.some(e=>e.id===sel.id));
    if(isSel)g.appendChild(el("circle",{cx:nd.x,cy:nd.y,r:r+4.5*k,class:"sel-ring","stroke-width":2*k}));
    g.appendChild(el("circle",{cx:nd.x,cy:nd.y,r:r,class:"core",fill:CATS[top].c,"stroke-width":1.6*k,opacity:dim?.2:.93}));
    if(isRel)g.appendChild(el("circle",{cx:nd.x,cy:nd.y,r:r+3.5*k,fill:"none",stroke:"var(--gold)","stroke-width":1.4*k,opacity:.85}));
    if(evs.some(e=>saved.e.has(String(e.id)))&&!dim)
      g.appendChild(el("circle",{cx:nd.x+r*.78,cy:nd.y-r*.78,r:3.8*k,fill:"var(--gold)",stroke:"#241f16","stroke-width":1.2*k}));
    if(n>1){const t=el("text",{x:nd.x,y:nd.y+3.2*k,class:"cnt","font-size":(9.2*k).toFixed(1),opacity:dim?.25:1});t.textContent=n;g.appendChild(t);}
    const act=()=>{
      if(!one)zoomToNode(nd);
      else if(n>1)select({type:"site",id:nd.sites[0]},{move:false});
      else select({type:"event",id:evs[0].id},{move:false});
    };
    g.addEventListener("click",ev=>{ev.stopPropagation();hideTip();act();});
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter")act();});
    g.addEventListener("pointerenter",ev=>ev.pointerType==="touch"||showTip(ev,nm,one?(n>1?"사건 "+n+"건 · 눌러서 열기":evs[0].y+" "+evs[0].n):"사건 "+n+"건 · 눌러서 확대"));
    g.addEventListener("pointerleave",hideTip);

  // 이름표는 자리가 있는 것부터: 관련 지점 → 사건 많은 곳 순
  const placed=[];
  const hits=(bx,skip)=>placed.some(q=>bx[0]<q[1]&&bx[1]>q[0]&&bx[2]<q[3]&&bx[3]>q[2])
    ||nodes.some(nd=>nd!==skip&&nd.x+nd.r>bx[0]&&nd.x-nd.r<bx[1]&&nd.y+nd.r>bx[2]&&nd.y-nd.r<bx[3]);

    if(nd.dim)return;

    t.textContent=nd.label;gLab.appendChild(t);
  });

  // 도시 이름: 마커가 놓인 자리면 점을 숨기고 이름을 마커 아래로 내린다
  const dense=view.w>W*(mob?.40:.50);
  cityNodes.forEach(c=>{
    if(dense&&!c.major){c.g.style.display="none";return;}
    c.g.style.display="";c.t.style.display="";
    const cx=px(c.lon),cy=py(c.lat);
    const hit=nodes.find(nd=>Math.hypot(nd.x-cx,nd.y-cy)<Math.max(gap*0.9,14*k));
    const dot=c.g.querySelector("circle");
    dot.style.display=hit?"none":"";
    if(hit&&hit.labelDrawn){c.t.style.display="none";return;}
    const ax=hit?hit.x:cx, ay=hit?hit.y:cy, ar=hit?hit.r:2*k;
    const tw=c.t.textContent.length*10*k, th=11*k;
    // 아래·위·오른쪽·왼쪽 순으로 빈자리를 찾는다
    const cands=[
      {an:"middle",x:ax,y:ay+ar+11*k,L:ax-tw/2,R:ax+tw/2,T:ay+ar+2*k,B:ay+ar+13*k},
      {an:"middle",x:ax,y:ay-ar-7*k,L:ax-tw/2,R:ax+tw/2,T:ay-ar-16*k,B:ay-ar-3*k},
      {an:"start",x:ax+ar+5*k,y:ay+3.4*k,L:ax+ar+4*k,R:ax+ar+6*k+tw,T:ay-th/2,B:ay+th/2},
      {an:"end",x:ax-ar-5*k,y:ay+3.4*k,L:ax-ar-6*k-tw,R:ax-ar-4*k,T:ay-th/2,B:ay+th/2}
    ];
    const clash=p=>hits([p.L,p.R,p.T,p.B],hit);
    let pick=cands.find(p=>!clash(p));

    c.t.setAttribute("text-anchor",pick.an);
    c.t.setAttribute("x",pick.x);c.t.setAttribute("y",pick.y);

}

/* 이동·확대 */
let dragged=false;
function bindMapEvents(){
  let drag=null;
  svg.addEventListener("pointerdown",e=>{hideTip();drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,id:e.pointerId,held:false};dragged=false;svg.classList.add("drag");});
  svg.addEventListener("pointermove",e=>{
    if(!drag)return;
    const s=unitsPerPx();
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4){
      if(!dragged){clearRegionChip();
        // 실제로 끌기 시작한 뒤에만 포인터를 붙잡는다 (마커 클릭을 가로채지 않도록)
        try{svg.setPointerCapture(drag.id);drag.held=true;}catch(err){}
      }
      dragged=true;
    }
    if(!dragged)return;
    view.x=drag.vx-(e.clientX-drag.x)*s;view.y=drag.vy-(e.clientY-drag.y)*s;
    clampView();svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
  });
  const endDrag=e=>{
    if(drag&&drag.held){try{svg.releasePointerCapture(drag.id);}catch(err){}}
    drag=null;svg.classList.remove("drag");
  };
  svg.addEventListener("pointerup",endDrag);
  svg.addEventListener("pointercancel",endDrag);
  svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.18:1/1.18,e);},{passive:false});
  $("#zin").onclick=()=>zoomAt(1/1.4);$("#zout").onclick=()=>zoomAt(1.4);
}
function clampView(){
  view.w=Math.min(view.w,W);view.h=view.w*(view.h/view.w);
  view.x=Math.max(-W*0.05,Math.min(view.x,W-view.w+W*0.05));
  view.y=Math.max(-H*0.05,Math.min(view.y,H-view.h+H*0.05));
}
function clearRegionChip(){document.querySelectorAll("#regions .chip").forEach(x=>x.classList.remove("on"));}
function zoomAt(f,e){
  clearRegionChip();
  const rect=svg.getBoundingClientRect();
  let cx=view.x+view.w/2,cy=view.y+view.h/2;
  if(e){const s=unitsPerPx();cx=view.x+((e.clientX-rect.left)-rect.width/2)*s+view.w/2;cy=view.y+((e.clientY-rect.top)-rect.height/2)*s+view.h/2;}
  const nw=Math.max(W*0.03,Math.min(W,view.w*f)),ratio=nw/view.w;
  view.x=cx-(cx-view.x)*ratio;view.y=cy-(cy-view.y)*ratio;
  view.w=nw;view.h=view.h*ratio;clampView();applyView();
}
function fitAll(){
  const r=svg.getBoundingClientRect(),ar=r.height/Math.max(r.width,1);
  let w=Math.max(W,H/Math.max(ar,0.01));
  view.w=w;view.h=w*ar;view.x=W/2-view.w/2;view.y=H/2-view.h/2;
  applyView();
}
function flyTo(lon,lat,span){

const REGIONS=[["전체",null],["한반도",[124.0,33.0,132.0,43.6]],["만주·연해주",[123.5,39.3,133.5,46.8]],["중국 관내",[105.0,22.0,123.0,37.5]],["일본",[128.5,30.0,143.0,43.0]]];
function fitBox(bx){
  const r=svg.getBoundingClientRect(),ar=r.height/Math.max(r.width,1);
  const x0=px(bx[0]),x1=px(bx[2]),y0=py(bx[3]),y1=py(bx[1]);

const Y0=1894,Y1=1945;

  const mobile=window.innerWidth<=900;

  rail.setAttribute("viewBox",`0 0 ${w} ${h}`);rail.textContent="";
  const pad=mobile?18:26;
  const pos=y=>mobile?pad+(y-Y0)/(Y1-Y0)*(w-pad*2):pad+(y-Y0)/(Y1-Y0)*(h-pad*2);
  // 선택 구간
  const a=pos(yearRange[0]),b=pos(yearRange[1]);
  rail.appendChild(mobile?el("rect",{x:a,y:6,width:Math.max(2,b-a),height:h-12,class:"sel"})
                        :el("rect",{x:6,y:a,width:w-12,height:Math.max(2,b-a),class:"sel"}));
  // 눈금
  for(let y=1895;y<=1945;y+=5){
    const p=pos(y);
    if(mobile){rail.appendChild(el("line",{x1:p,y1:h-16,x2:p,y2:h-10,class:"tick"}));
      const t=el("text",{x:p,y:h-3,class:"ticklab","text-anchor":"middle"});t.textContent=y;rail.appendChild(t);}
    else{rail.appendChild(el("line",{x1:w-16,y1:p,x2:w-10,y2:p,class:"tick"}));
      const t=el("text",{x:w-20,y:p+3,class:"ticklab","text-anchor":"end"});t.textContent=y;rail.appendChild(t);}
  }
  // 사건 점
  const all=EV.filter(e=>activeCats.has(e.cat)&&matchQ(e));
  const seen={};
  all.forEach(e=>{
    const p=pos(e.ys);const key=Math.round(p);seen[key]=(seen[key]||0)+1;
    const off=((seen[key]-1)%5)*5;
    const inR=e.ys>=yearRange[0]&&e.ys<=yearRange[1];
    const c=el("circle",{r:3,fill:CATS[e.cat].c,class:"edot",opacity:inR?.95:.22});
    if(mobile){c.setAttribute("cx",p);c.setAttribute("cy",14+off);}
    else{c.setAttribute("cx",16+off);c.setAttribute("cy",p);}
    c.style.cursor="pointer";
    c.addEventListener("pointerdown",ev=>ev.stopPropagation());
    c.addEventListener("click",ev=>{ev.stopPropagation();select({type:"event",id:e.id});});
    c.addEventListener("pointerenter",ev=>showTipRail(ev,e));c.addEventListener("pointerleave",hideTip);
    rail.appendChild(c);
  });
}

/* PNG·JPG — 캔버스에 직접 그린다 */
function sheetCanvas(){
  const blocks=sheetBlocks(),W=1240,M=72,cw=W-M*2;
  const SANS='"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  const SERIF='"Nanum Myeongjo","Batang","AppleMyungjo",serif';
  const wrap=(ctx,txt,maxW)=>{
    const out=[];let line="";
    for(const ch of String(txt)){
      const t=line+ch;
      if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch;}else line=t;
    }
    if(line)out.push(line);return out;
  };
  const run=(ctx,draw)=>{
    let y=M;
    ctx.textBaseline="alphabetic";
    ctx.font=`44px ${SERIF}`;
    if(draw){ctx.fillStyle="#171410";ctx.fillText("모아 둔 독립운동 기록",M,y+38);}
    y+=60;
    ctx.font=`16px ${SANS}`;
    if(draw){ctx.fillStyle="#6b6455";ctx.fillText("대한독립운동 지도 · 1894–1945 · "+todayStr()+" 기준",M,y+14);}
    y+=32;
    if(draw){ctx.strokeStyle="#c2b79c";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(M,y+.5);ctx.lineTo(W-M,y+.5);ctx.stroke();}
    y+=30;
    blocks.forEach(b=>{
      if(b.h){
        y+=14;ctx.font=`15px ${SANS}`;
        if(draw){ctx.fillStyle="#7d7666";ctx.fillText(b.h,M,y+13);}
        y+=30;return;
      }
      const x0=M+16,tw=cw-16,top=y;
      ctx.font=`23px ${SANS}`;
      const yw=b.y?(ctx.font=`21px ${SERIF}`,ctx.measureText(b.y).width+12):0;
      if(draw&&b.y){ctx.fillStyle="#8a6d15";ctx.fillText(b.y,x0,y+20);}
      ctx.font=`23px ${SANS}`;
      const tl=wrap(ctx,b.t,tw-yw);
      tl.forEach((ln,i)=>{if(draw){ctx.fillStyle="#171410";ctx.fillText(ln,x0+(i?0:yw),y+20+i*30);}});
      y+=20+ (tl.length-1)*30 +14;
      if(b.m){ctx.font=`15px ${SANS}`;
        if(draw){ctx.fillStyle="#6b6455";ctx.fillText(b.m,x0,y+13);} y+=26;}
      if(b.d){ctx.font=`17px ${SANS}`;
        const dl=wrap(ctx,b.d,tw);
        dl.forEach((ln,i)=>{if(draw){ctx.fillStyle="#2a261e";ctx.fillText(ln,x0,y+15+i*28);}});
        y+=dl.length*28+4;}
      if(b.x){ctx.font=`15px ${SANS}`;
        const xl=wrap(ctx,"관련 — "+b.x,tw);
        xl.forEach((ln,i)=>{if(draw){ctx.fillStyle="#5f594b";ctx.fillText(ln,x0,y+13+i*24);}});
        y+=xl.length*24+2;}
      if(draw){ctx.fillStyle=b.c;ctx.fillRect(M,top,4,y-top-2);}
      y+=26;
    });
    y+=10;
    if(draw){ctx.strokeStyle="#c2b79c";ctx.beginPath();ctx.moveTo(M,y+.5);ctx.lineTo(W-M,y+.5);ctx.stroke();}
    y+=24;
    ctx.font=`14px ${SANS}`;
    const ft=wrap(ctx,SITE_URL+" · 연도와 명칭은 한국사 교과서와 국가보훈부·독립기념관의 일반 표기를 따랐습니다.",cw);
    ft.forEach((ln,i)=>{if(draw){ctx.fillStyle="#6b6455";ctx.fillText(ln,M,y+12+i*22);}});
    y+=ft.length*22;
    return y+M;
  };
  const probe=document.createElement("canvas").getContext("2d");
  const H=Math.ceil(run(probe,false));
  const s=2,cv=document.createElement("canvas");
  cv.width=W*s;cv.height=H*s;
  const ctx=cv.getContext("2d");ctx.scale(s,s);
  ctx.fillStyle="#f6f1e4";ctx.fillRect(0,0,W,H);
  run(ctx,true);
  return cv;
}
function downloadSheet(kind){
  const cv=sheetCanvas();
  const mime=kind==="jpg"?"image/jpeg":"image/png";
  cv.toBlob(bl=>{
    if(!bl)return;
    const a=document.createElement("a");
    a.href=URL.createObjectURL(bl);
    a.download="독립운동_모음_"+fileStamp()+"."+kind;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },mime,kind==="jpg"?0.93:undefined);
}

/* ===================== 상세 ===================== */
function fitEvents(ids){
  const pts=EV.filter(e=>ids.has(e.id)).map(e=>place(e));
  if(!pts.length)return;
  const r=svg.getBoundingClientRect();
  const xs=pts.map(p=>px(p[0])),ys=pts.map(p=>py(p[1]));
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const padU=Math.max(60,(x1-x0)*0.18,(y1-y0)*0.18);
  x0-=padU;x1+=padU;y0-=padU;y1+=padU;
  const ar=r.height/Math.max(r.width,1);
  let w=Math.max(x1-x0,(y1-y0)/ar);w=Math.min(w,W);
  view.w=w;view.h=w*ar;
  view.x=(x0+x1)/2-view.w/2;view.y=(y0+y1)/2-view.h/2;
  clampView();applyView();clearRegionChip();
}
function select(s,opt){
  sel=s;
  // 지도에서 직접 누른 경우에는 화면을 그대로 두고, 목록·연결에서 고른 경우에만 그 자리로 옮긴다
  const move=!(opt&&opt.move===false);
  if(move){
    if(s.type==="event"){const e=evById(s.id);flyTo(place(e)[0],place(e)[1],Math.min(view.w/(K*CY),14));}
    if(s.type==="site"){const p=S[s.id];flyTo(p[0],p[1],Math.min(view.w/(K*CY),14));}
  }
  if(s.type==="org"||s.type==="ppl")fitEvents(relatedIds());
  renderDetail();drawMarkers();renderList();
  if(window.innerWidth<=900&&s.type)document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"});
}

  if(sel.type==="event"){
    const e=evById(sel.id);
    h+=`<div class="kicker">${e.y}</div><h2>${e.n}</h2><div class="meta">${place(e)[2]}</div>${chipsHTML(e)}<p>${e.d}</p>`;
    const orgs=(e.o||[]).map(i=>({t:"org",i,n:orgById(i)?.n||i}));
    const ppl=(e.m||[]).map(i=>({t:"ppl",i,n:pplById(i)?.n||i}));
    if(orgs.length)h+=`<h3>참여 단체</h3>`+linkBtns(orgs);
    if(ppl.length)h+=`<h3>참여 인물</h3>`+linkBtns(ppl);
    const near=EV.filter(x=>x.s===e.s&&x.id!==e.id).map(x=>({t:"event",i:x.id,n:x.n,y:x.ys}));
    if(near.length)h+=`<h3>같은 장소의 다른 사건</h3>`+linkBtns(near);
  }else if(sel.type==="site"){
    const p=S[sel.id], evs=filtered().filter(e=>e.s===sel.id).sort((a,b)=>a.ys-b.ys);
    h+=`<div class="kicker">장소</div><h2>${p[2]}</h2><div class="meta">여과 조건에 해당하는 사건 ${evs.length}건</div>`;
    h+=linkBtns(evs.map(e=>({t:"event",i:e.id,n:e.n,y:e.ys})));
  }else if(sel.type==="org"){
    const o=orgById(sel.id), evs=EV.filter(e=>(e.o||[]).includes(o.id)).sort((a,b)=>a.ys-b.ys);
    const mem=[...new Set(evs.flatMap(e=>e.m||[]))];
    h+=`<div class="kicker">단체</div><h2>${o.n}</h2><div class="meta">${o.y}</div><p>${o.d}</p>`;
    if(evs.length)h+=`<h3>관련 사건</h3>`+linkBtns(evs.map(e=>({t:"event",i:e.id,n:e.n,y:e.ys})));
    if(mem.length)h+=`<h3>관련 인물</h3>`+linkBtns(mem.map(i=>({t:"ppl",i,n:pplById(i)?.n||i})));
  }else if(sel.type==="ppl"){
    const p=pplById(sel.id), evs=EV.filter(e=>(e.m||[]).includes(p.id)).sort((a,b)=>a.ys-b.ys);
    const orgs=[...new Set(evs.flatMap(e=>e.o||[]))];
    h+=`<div class="kicker">인물</div><h2>${p.n}</h2><div class="meta">${p.l} · ${p.r}</div><p>${p.d}</p>`;
    if(evs.length)h+=`<h3>주요 활동</h3>`+linkBtns(evs.map(e=>({t:"event",i:e.id,n:e.n,y:e.ys})));
    if(orgs.length)h+=`<h3>소속 단체</h3>`+linkBtns(orgs.map(i=>({t:"org",i,n:orgById(i)?.n||i})));
  }else if(sel.type==="note"){
    h+=`<div class="kicker">일러두기</div><h2>이 지도를 읽는 법</h2>
    <p>시대 단추는 연표의 구간을 옮기는 단추입니다. 왼쪽 연표를 위아래로 끌면 원하는 연도만 따로 볼 수 있고, 성격 단추 하나를 누르면 그 성격만 남습니다.</p>
    <p>지도의 동그라미는 사건이 일어난 장소이며, 숫자는 그곳에서 일어난 사건의 수입니다. 색은 운동의 성격을 뜻합니다. 사건을 열면 그 자리에 참여한 단체와 인물로 이어지고, 단체나 인물에서 다시 사건으로 돌아올 수 있습니다.</p>
    <p>사건·단체·인물·해외 활동 옆의 ☆를 누르면 모음에 담깁니다. 담은 것은 오른쪽 '모음' 칸에 종류별로 모이고, 지도에서는 금색 점이 붙습니다. '모은 것만'을 켜면 담아 둔 것만 지도와 목록에 남습니다. 모아 둔 것은 PDF·PNG·JPG로 내려받아 탐구 자료로 쓰실 수 있습니다. 담은 내용은 이 브라우저에 저장되어 창을 닫았다 열어도 남아 있으나, 기기나 브라우저를 바꾸면 사라지므로 모음 칸 아래의 내보내기로 글자를 받아 두었다가 가져오기로 옮기시면 됩니다.</p>
    <p>좌표는 사건이 일어난 고을의 중심을 기준으로 삼은 근사값입니다. 봉오동·청산리처럼 정확한 전투 지점에 이견이 있는 곳은 대표 지점 하나로 표시했습니다. 국경선은 압록강·두만강만 표시했고, 만주국·중화민국 등 시기별 행정구역 변화는 반영하지 않았습니다.</p>
    <p>연도와 명칭은 한국사 교과서와 국가보훈부·독립기념관의 일반 표기를 따랐습니다. 학계에서 견해가 갈리는 사건(무오독립선언의 발표 시점, 자유시 참변의 경위 등)은 정설로 굳은 서술을 피했습니다. 발표나 보고서에 쓸 때는 반드시 원 사료나 공훈전자사료관 등에서 다시 확인하시기 바랍니다.</p>
    <div class="quote">지도에 담긴 사건은 전체의 일부입니다. 빠진 사건이 곧 덜 중요한 사건은 아닙니다.</div>`;
  }else if(sel.type==="abroad"){
    const a=ABROAD[sel.id];
    h+=`<div class="kicker">${a.y} · 지도 범위 밖</div><h2>${a.n}</h2><div class="meta">${a.p}</div><p>${a.d}</p>`;
  }
  D.innerHTML=h;
  if(canSave){
    const on=isSaved(sel.type,sel.id);
    const wrap=document.createElement("div");
    wrap.innerHTML=`<button class="savebtn${on?" on":""}" id="saveBtn">${on?"★ 모음에서 빼기":"☆ 모음에 담기"}</button>`;
    const anchor=D.querySelector(".tags")||D.querySelector(".meta")||D.querySelector("h2");
    anchor.after(wrap);
    $("#saveBtn").onclick=()=>toggleSave(sel.type,sel.id);
  }
  $("#backBtn").onclick=closeDetail;
  D.querySelectorAll(".link").forEach(b=>b.onclick=()=>select({type:b.dataset.t,id:b.dataset.t==="event"?+b.dataset.i:b.dataset.i}));
}

/* ===================== 갱신 ===================== */
function refresh(){
  syncChips();drawMarkers();renderList();drawRail();
  $("#tb-e").textContent=filtered().length;$("#tb-o").textContent=ORG.length;$("#tb-p").textContent=PPL.length;
  $("#tb-s").textContent=savedCount()||"";
}
function init(){
  loadSaved();
  initMap();buildChips();bindRail();
  $("#ecount").textContent=EV.length;$("#ocount").textContent=ORG.length;$("#pcount").textContent=PPL.length;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
    tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
    closeDetail();renderList();
  });
  const setPh=()=>{$("#q").placeholder=window.innerWidth<=900?"검색":"사건·단체·인물 검색";};setPh();
  window.addEventListener("resize",setPh);
  $("#q").oninput=e=>{query=e.target.value.trim();refresh();};
  $("#routeBtn").onclick=()=>{showRoute=!showRoute;gRoute.style.display=showRoute?"":"none";$("#routeBtn").classList.toggle("on",showRoute);};
  const ft=$("#filterToggle"),fl=document.querySelector(".filters");
  ft.onclick=()=>{
    const closed=fl.classList.toggle("closed");
    ft.classList.toggle("closed",closed);ft.setAttribute("aria-expanded",String(!closed));
    requestAnimationFrame(()=>{applyView();drawRail();});
  };
  if(window.innerWidth<=900){fl.classList.add("closed");ft.classList.add("closed");ft.setAttribute("aria-expanded","false");}
  $("#noteBtn").onclick=()=>select({type:"note",id:0});
  $("#onlySavedBtn").onclick=()=>{
    onlySaved=!onlySaved;$("#onlySavedBtn").classList.toggle("on",onlySaved);
    if(onlySaved&&!savedCount()){tab="saved";document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="saved"));closeDetail();}
    refresh();
  };
  $("#labelBtn").onclick=()=>{showLabels=!showLabels;$("#labelBtn").classList.toggle("on",showLabels);drawMarkers();};
  svg.addEventListener("click",()=>{if(sel.type&&!dragged)closeDetail();});
  window.addEventListener("resize",()=>{applyView();drawRail();});
  applyView();fitAll();refresh();
}
init();
</script>
</body>
</html>
